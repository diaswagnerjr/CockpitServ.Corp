p:10px;border-top:1px solid var(--line);padding:12px 0}.info{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;background:var(--panel2);border:1px solid var(--line);font-size:.78rem;font-weight:900;color:var(--accent);margin-left:6px}.matrix-shell{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:center}.ylabel{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:900;color:#0b1b63;text-align:center}.matrix{height:420px;border:1px solid var(--line);background:linear-gradient(90deg,transparent 0 49.7%,var(--line) 49.7% 50.3%,transparent 50.3%),linear-gradient(0deg,transparent 0 49.7%,var(--line) 49.7% 50.3%,transparent 50.3%);position:relative;background-color:var(--panel)}.matrix:after{content:"Foco da liderança";position:absolute;right:20px;top:18px;color:#1d4ed8;font-weight:900;font-size:.9rem}.focus{position:absolute;right:0;top:0;width:50%;height:50%;background:var(--quad);z-index:0}.axisnote{display:flex;justify-content:space-between;color:var(--muted);font-size:.75rem;margin:6px 0 0 44px}.xlabel{text-align:center;font-weight:900;margin-top:8px}.dot{position:absolute;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:.78rem;font-weight:900;transform:translate(-50%,50%);box-shadow:0 0 0 4px var(--panel);z-index:2}.dot.done{opacity:.62}.dot:hover{z-index:12}.dot:hover .tip{display:block}.tip{display:none;position:absolute;left:40px;top:-12px;width:320px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;box-shadow:var(--shadow);font-weight:500;text-align:left;z-index:10}.risk-critical,.leg-critical{background:#e91e63}.risk-operational,.leg-operational{background:#1d4ed8}.risk-financial,.leg-financial{background:#d99a09}.risk-balanced{background:#6b5bd2}.legend{display:grid;grid-template-columns:160px 1fr;gap:10px 22px;max-width:720px;margin:18px 0 0 44px}.leg{width:10px;height:10px;display:inline-block;margin-right:10px}.badge{display:inline-flex;align-items:center;gap:7px;font-weight:900;white-space:nowrap}.badge:before{content:"";width:10px;height:10px;border-radius:50%;display:inline-block}.b-blue:before{background:#2563eb}.b-red:before{background:#dc2626}.b-yellow:before{background:#d99a09}.b-green:before{background:#16a34a}.bars{height:280px;display:flex;align-items:end;gap:8px;border-bottom:1px solid var(--line);padding-top:24px}.bar{flex:1;background:#2563eb;border-radius:4px 4px 0 0;min-height:2px;position:relative}.bar span{position:absolute;bottom:-24px;left:50%;transform:translateX(-50%);font-size:.75rem}.bar strong{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:.7rem;white-space:nowrap}.table-wrap{overflow:auto}.table-head{margin-bottom:-8px}.table-head h3{margin-bottom:4px}.table-wrap.critical-table{max-height:70vh;position:relative;border-top-left-radius:0;border-top-right-radius:0}.table-wrap.is-fullscreen{position:fixed;inset:16px;z-index:80;max-height:none;background:var(--panel);padding:12px;box-shadow:0 24px 80px rgba(0,0,0,.32)}table{width:100%;border-collapse:collapse;min-width:1120px}.crit-table{min-width:1720px}.crit-table.present{min-width:980px}.crit-table th,.crit-table td{background:var(--panel)}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:.72rem;text-transform:uppercase;color:var(--muted);background:var(--panel2);cursor:pointer;white-space:nowrap}td{font-size:.9rem}.edit-cell{min-width:150px}.edit-cell textarea,.edit-cell input,.edit-cell select{font-size:.82rem;width:100%}.critical-table th{position:sticky;top:0;z-index:6}.critical-table th:nth-child(-n+3){z-index:10}.crit-table th:nth-child(1),.crit-table td:nth-child(1){position:sticky;left:0;min-width:58px;width:58px;z-index:5}.crit-table th:nth-child(2),.crit-table td:nth-child(2){position:sticky;left:58px;min-width:210px;width:210px;z-index:5}.crit-table th:nth-child(3),.crit-table td:nth-child(3){position:sticky;left:268px;min-width:340px;width:340px;z-index:5}.crit-table.present th:nth-child(3),.crit-table.present td:nth-child(3){min-width:300px;width:300px}.crit-table th:nth-child(-n+3){background:var(--panel2)}.crit-table td:nth-child(-n+3){background:var(--panel)}.crit-table td:nth-child(3){box-shadow:8px 0 12px -12px rgba(15,23,32,.5)}.hidden{display:none!important}.actions{display:flex;gap:10px;flex-wrap:wrap}.drive{color:inherit;font-weight:900}@media(max-width:980px){.shell{grid-template-columns:1fr}.side{position:static;height:auto}.metrics,.grid2,.grid3,.routine-grid,.risk,.flow,.filters{grid-template-columns:1fr}main,.side{padding:16px}.top,.head,.banner,.table-head{align-items:stretch;flex-direction:column}.matrix{height:360px}.tip{width:260px}.legend{grid-template-columns:1fr}.crit-table th:nth-child(2),.crit-table td:nth-child(2){min-width:180px;width:180px}.crit-table th:nth-child(3),.crit-table td:nth-child(3){left:238px;min-width:260px;width:260px}}

(function(){var SUPA='https://reebavnvftfibyhhjxat.supabase.co',KEY='sb_publishable_WksWBZLsVc1f4JBmQiRK5A_6swUYr-Z',token=localStorage.getItem('csc_token')||'',adminEmails=['wagnerdj@suzano.com.br'];var state={tab:'processos',admin:false,recovery:false,crit:[],src:[],gates:[],files:[],sort:{},filters:{q:'',cat:'',classif:'',resp:'',status:'',deadline:''},critView:'present'};var tabs={processos:'Processos & Rotinas',toolkit:'Tool Kit e Radar',criticos:'Processos críticos',sourcing:'Visão sourcing',gates:'Calendário de gates'};var sharepoint='https://suzano.sharepoint.com/sites/SupriADMDigitalTech/Documentos%20Compartilhados/Forms/AllItems.aspx?TeamsCID=8995a6d8%2Dfb49%2D45e5%2D867a%2Dd062dd9f0096';
var processBlocks=[['Gestão da Demanda e Pipeline',['Gestão estruturada da demanda a partir do Plano Base, calendário de categorias e demandas das áreas clientes.','Pipeline único, com visibilidade de requisições, contratos a vencer, temas estruturantes e demandas não planejadas.'],['Ausência de Sourcing Plan integrado.','Oportunidade de, sempre que possível, antecipar o planejamento das demandas.','Oportunidade de maior uso do Farol de Contratos e de KPIs alinhados com a célula de gestão.'],['Rotina de leitura do Sourcing Monitor para enxergar processos futuros e riscos de capacidade.','Célula de gestão cruzando Sourcing Monitor, Farol de Contratos, saldo/vigência e status de requisição.','Rotina de agendas internas e externas para antecipar demandas e temas estruturantes e alimentar o cockpit.']],['Governança e Priorização',['Entendimento da demanda, classificação de criticidade, definição do fórum adequado, stage gates e formalização.'],['Critérios de criticidade pouco explícitos.','Escalonamento tardio de iniciativas estratégicas, complexas ou de alto valor.'],['Processos de R$5MM a R$15MM por valor global devem ser deliberados por e-mail, com racional documentado e apoio dos toolkits.','Processos acima de R$15MM devem passar por gate com o GE da área.','Gate de Estratégia acontece antes da RFQ: alinha demanda, categoria, escopo, especificações, mercado, vendor list, estratégia inicial e premissas comerciais antes de ir ao mercado.','Gate de Negociação/Fechamento valida recomendação, estratégia de negociação, últimos ajustes, plano de implementação e subida de alçadas.','Processos acima de R$15MM devem ter ficha-resumo preparada para sequenciamento de assinatura no CLM, conforme modelo do toolkit.','Todos os arquivos do processo devem ficar no drive da área: <a class="drive" target="_blank" href="'+sharepoint+'">abrir repositório oficial</a>.']],['Gestão de Categorias e Ciclo Básico do Contrato',['Agenda contínua com clientes internos, leitura de categoria e gestão do ciclo de vida contratual.','Gestão de saldo, vigência, aditivos, pré-renovação e retroalimentação do pipeline.'],['Base contratual, saldo e alarmística ainda podem ser mais integrados à gestão semanal.','Renovações, rebids e encerramentos precisam ser antecipados com maior previsibilidade.'],['Célula de gestão sustenta cadastro, qualidade da base, controle de saldo/vigência, alarmes e encaminhamento para aditivar, rebidar, renovar ou encerrar.','GCATs e célula atuam juntos para reduzir ruptura, organizar handover e padronizar templates, SLAs e controles.']],['Gestão, Indicadores e Liderança',['Liderança direciona o time por indicadores, inteligência de mercado, criticidade, riscos e governança.'],['Oportunidade de ajustar agendas para que processos, riscos e decisões apareçam no dia a dia, e não apenas no fechamento do mês.'],['Gestão à vista dos gates, sourcing, críticos, indicadores, pendências da célula de gestão e plano de ação.','Ritos semanais, mensais e quadrimestrais conectados a decisões, priorização e desenvolvimento do time.']]];
var cellSteps=['B0 Cadastro e classificação da base por criticidade, risco e contingência.','B1 Controle de saldo total, consumido, reservado, disponível e prazo restante.','B2 Previsão de consumo, ruptura, sobre/subutilização e necessidade de RC/FRS.','B3 Acompanhamento de prazo contratual, handover e pendências operacionais.','B4 Alarmística e escalonamento de vencimentos/saldos em 180/90/60 dias.','B5 Definição de tratativa: aditivar, rebidar, renovar, encerrar ou acionar gate 0.'];var cellRoles=['Criar AFs, aditivos, reajustes e encerramentos no ERP com templates e workflow via Planner.','Manter contratos, pedidos, SoulPlan, RCs e FRS saneados e atualizados.','Monitorar pré-renovações, consumo, saldo, vencimentos, rupturas e pendências com áreas clientes.','Conduzir ritos semanais com GCATs para prioridades, urgências e plano de ação.','Acompanhar KPIs, riscos, governança, matriz RACI, qualidade de base e escalations.','Coordenar handover por unidade, padronizar templates, SLAs, processos e benchmarks.'];var routines=[['Semanal',['1:1s para direcionamento, destravamento e touch de gestão.','Reunião semanal para recados, gates, críticos, agenda, plano de ação e follow-up da célula.']],['Mensal',['Performance com Ns de Suprimentos.','Agenda das áreas (Tech, Facilities e outras).','Touch com guardiões de Sourcing Monitor, PB/RF & Metas, Matricial e CLM.']],['Quadrimestral',['Agenda estruturante, projetos, metas e direcionamentos.']],['Carreira',['Feedback, PDI e carreira.'],'Bimestral/Trimestral']];var toolkit=[['Approach de Base','Resumo executivo do escopo','Categoria, descrição, valor PB, baseline/real, vigência, prazo de pagamento, subcontratação, paramétrica, cláusula de saída, take or pay, SLAs e pontos jurídicos.','Consolida os fatos mínimos para liderança entender tamanho, prazo, risco e decisão necessária.'],['Approach de Base','Resumo da categoria','Spend total, share por unidade de negócio, fornecedor e unidade; fatia endereçada e destino esperado.','Mostra relevância da categoria e quanto do spend está em negociação.'],['Approach de Base','Entendimento do escopo','Local, serviços pedidos, quantitativos, cenário atual de fornecimento e premissas operacionais.','Evita comparar propostas desalinhadas e separa preço de volume/demanda.'],['Approach do Processo','Mercado e vendor list','Dinâmica de mercado, oferta, representatividade Suzano, barganha, drivers, vendor list e cenário oferta/demanda.','Base para concorrência, BATNA, riscos de fornecedor e estratégia de negociação.'],['Approach do Processo','Parecer técnico, Linkana e performance','Resumo técnico, avaliação de fornecedores, compliance, saúde cadastral e SLAs/performance atuais quando houver.','Suporta recomendação comercial por capacidade técnica, risco e histórico.'],['Approach do Processo','Cost breakdown, MCC e cenários','Escopo, preços unitários/totais, MCC, Plano Base, Real, should cost e cenários equalizados.','Compara fornecedores em base equivalente e isola preço, volume e escopo.'],['Approach do Processo','Alavancas e recomendação','Alavancas exploradas, recomendação comercial, mapa final do processo e próximos passos de implementação.','Transforma análise em decisão e plano de execução.'],['Approach para Ativos','Ativos, rental/buy e paramétrica','Composição do ativo no CBD, comparação rental/buy, remuneração do ativo no contrato e cuidado para não remunerar duas vezes via paramétrica.','Necessário quando há CAPEX/ativo, frota, equipamentos, mobilização ou remuneração financeira relevante.']];
async function api(table,opt){opt=opt||{};var method=opt.method||'GET',url=SUPA+'/rest/v1/'+table+(method==='GET'?'?select=*&order=created_at.asc':'');var h={apikey:KEY,Authorization:'Bearer '+(token||KEY),'Content-Type':'application/json',Prefer:'return=representation'};var r=await fetch(url,{method:method,headers:h,body:opt.body?JSON.stringify(opt.body):undefined});if(!r.ok)throw Error(await r.text());return method==='DELETE'?[]:r.json()}async function rpc(name,body){var r=await fetch(SUPA+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error(await r.text());return r.json()}async function load(){try{var r=await Promise.all([api('csc_critical_processes'),api('csc_sourcing_processes'),api('csc_gate_events'),api('csc_inspiration_files')]);state.crit=r[0];state.src=r[1];state.gates=r[2];state.files=r[3]}catch(e){console.warn(e)}render()}function esc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function sum(a,k){return a.reduce((s,x)=>s+Number(x[k]||0),0)}function money(v){return v==null||v===''?'N/A':'R$'+Number(v).toFixed(1)+'MM'}function pct(v){return v==null||v===''?'N/A':Number(v).toFixed(1)+'%'}function metric(a,b){return '<article class="metric"><span>'+a+'</span><strong>'+b+'</strong></article>'}function weekDelta(){var now=new Date(),start=new Date(now);start.setDate(now.getDate()-7);var prev=new Date(now);prev.setDate(now.getDate()-14);var curr=state.crit.filter(x=>isDone(x)&&new Date(x.updated_at)>=start).length,old=state.crit.filter(x=>isDone(x)&&new Date(x.updated_at)>=prev&&new Date(x.updated_at)<start).length;return (curr-old>=0?'+':'')+(curr-old)+' vs sem. ant.'}function isDone(x){return String(x.status||x.process_status||'').toLowerCase().includes('conclu')}function render(){authTitle.textContent=state.recovery?'Definir nova senha':(state.admin?'Admin autenticado':'Login admin');loginBtn.textContent=state.recovery?'Salvar nova senha':'Entrar para editar';resetBtn.classList.toggle('hidden',state.recovery||state.admin);logoutBtn.classList.toggle('hidden',!state.admin&&!state.recovery);nav.innerHTML=Object.keys(tabs).map(k=>'<button class="'+(state.tab===k?'active':'')+'" data-tab="'+k+'">'+tabs[k]+'</button>').join('');document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;document.body.classList.remove('table-fullscreen');render()});title.textContent=tabs[state.tab];var showMetrics=state.tab!=='toolkit';metrics.classList.toggle('hidden',!showMetrics);if(showMetrics&&state.tab==='criticos')metrics.innerHTML=metric('Críticos abertos',state.crit.filter(x=>!isDone(x)).length)+metric('Críticos concluídos',state.crit.filter(isDone).length)+metric('Evolução semanal',weekDelta())+metric('Total monitorado',state.crit.length);else metrics.innerHTML=showMetrics?metric('Críticos abertos',state.crit.filter(x=>!isDone(x)).length)+metric('Spend sourcing >5MM','R$'+sum(state.src,'spend').toFixed(1)+'MM')+metric('Processos >5MM',state.src.length)+metric('Gates pendentes',state.gates.filter(x=>x.negotiation_status==='Pendente'||x.strategy_status==='Pendente').length):'';({processos,toolkit:toolkitPage,criticos,sourcing,gates})[state.tab]()}function col(t,a,c){return '<div class="col '+(c||'')+'"><strong>'+t+'</strong><ul>'+a.map(x=>'<li>'+x+'</li>').join('')+'</ul></div>'}
function processos(){view.innerHTML='<div class="banner"><div><p class="eyebrow">Modelo operacional</p><h2>Rotina integrada para antecipar demandas, priorizar decisões e proteger o ciclo contratual.</h2></div><button id="goGate">Ver calendário de gates</button></div><div class="grid2">'+processBlocks.map(b=>'<article class="card"><h3>'+b[0]+'</h3>'+col('Processo esperado',b[1])+col('Gaps / oportunidades',b[2],'warn')+col('To be proposto',b[3],'ok')+'</article>').join('')+'</div><section class="card"><p class="eyebrow">Célula de Gestão</p><h2>Gestão operacional, governança e suporte aos GCATs</h2><p class="muted">A célula não cuida apenas de contratos: ela organiza dados, pendências, RCs/FRS, prazos, saldo, handover, KPIs, riscos, governança e padronização operacional para dar previsibilidade ao time.</p><div class="flow">'+cellSteps.map(x=>'<div class="step"><strong>'+x.slice(0,2)+'</strong><span>'+x.slice(3)+'</span></div>').join('')+'</div><div class="grid2" style="margin-top:14px">'+cellRoles.map(x=>'<div class="col">'+x+'</div>').join('')+'</div></section><section><p class="eyebrow">Rotinas</p><h2>Dinâmica das reuniões</h2><div class="routine-grid">'+routines.map(r=>'<article class="routine"><h3>'+r[0]+'</h3>'+(r[2]?'<span class="freq">'+r[2]+'</span>':'')+'<ul>'+r[1].map(x=>'<li>'+x+'</li>').join('')+'</ul></article>').join('')+'</div></section>';goGate.onclick=()=>{state.tab='gates';render()}}

function riskClass(x){var vals={critical:score(x.risk_critical),operational:score(x.risk_operational),financial:score(x.risk_financial)},m=Math.max(vals.critical,vals.operational,vals.financial),tops=Object.keys(vals).filter(k=>vals[k]===m);return tops.length>1?'balanced':tops[0]}function score(x){return x==='Alto'?3:x==='Médio'?2:1}function riskSummary(x){var parts=[];if(x.risk_critical)parts.push('Crítico: '+x.risk_critical);if(x.risk_operational)parts.push('Operacional: '+x.risk_operational);if(x.risk_financial)parts.push('Financeiro: '+x.risk_financial);return parts.join(' | ')}function statusSummary(x){return [x.process_status||x.status,x.deadline_status].filter(Boolean).join(' | ')}function spendShare(x){return money(x.spend_involved)+' | Share '+pct(x.share_percent)}function dotTitle(x){return esc((x.matrix_number||'')+' - '+x.category+'\nResponsável: '+(x.responsible||x.owner||'')+'\nClassificação: '+(x.classification||'')+' | Prazo: '+(x.deadline_status||'')+'\n'+(x.description||''))}function matrixDots(){var seen={},offsets=[[0,0],[-5,-3],[5,3],[-4,5],[4,-5],[0,7],[7,0],[-7,0],[0,-7],[6,-2],[-6,2],[2,6],[-2,-6],[8,5],[-8,-5]];return state.crit.map(x=>{var k=(x.criticality||0)+'-'+(x.urgency||0),n=seen[k]||0,o=offsets[n%offsets.length];seen[k]=n+1;return {row:x,left:Math.min(94,Math.max(6,Number(x.urgency||1)*19+o[0])),bottom:Math.min(94,Math.max(6,Number(x.criticality||1)*19+o[1]))}})}function options(key){return [...new Set(state.crit.map(x=>x[key]).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'pt-BR')).map(v=>'<option>'+esc(v)+'</option>').join('')}
function statusBadge(x){var text=typeof x==='string'?x:statusSummary(x),s=String(text).toLowerCase(),cls=s.includes('conclu')?'b-green':s.includes('planej')?'b-blue':s.includes('atras')?'b-red':'b-yellow';return '<span class="badge '+cls+'">'+esc(text||'N/A')+'</span>'}function criticos(){var rows=filteredCrit().map(x=>Object.assign({},x,{risk_summary:riskSummary(x),status_summary:statusSummary(x),spend_share:spendShare(x),next_step:x.final_comment||x.action_plan||''})),present=state.critView!=='detail',cols=present?[['#','matrix_number'],['Categoria','category'],['Ponto de atenção','attention_point'],['Spend / Share','spend_share'],['Ruídos','risk_summary'],['Classificação','classification'],['Responsável','responsible'],['Status / Prazo','status_summary'],['Comentário / Encaminhamento','next_step']]:[['#','matrix_number'],['Categoria','category'],['Descrição','description'],['Spend Categoria','spend_category'],['Spend Envolvido','spend_involved'],['Share','share_percent'],['Ponto de Atenção','attention_point'],['Ruídos','risk_summary'],['Classificação','classification'],['Responsável','responsible'],['Sinergia Sourcing','sourcing_synergy'],['Comentário Final','final_comment'],['Data Planejada','planned_capture_date'],['Data Estimada','estimated_capture_date'],['Status','process_status'],['Prazo','deadline_status']];view.innerHTML='<div class="matrix-shell"><div class="ylabel">Criticidade</div><div><div class="matrix"><div class="focus"></div>'+matrixDots().map(p=>{var x=p.row,cls='risk-'+riskClass(x)+(isDone(x)?' done':'');return '<div class="dot '+cls+'" style="left:'+p.left+'%;bottom:'+p.bottom+'%" title="'+dotTitle(x)+'">'+(x.matrix_number||'')+'<div class="tip"><strong>'+esc(x.matrix_number+' - '+x.category)+'</strong><div>'+esc(x.description)+'</div><div class="muted">Responsável: '+esc(x.responsible||x.owner)+'</div><div class="muted">Ruídos: '+esc(riskSummary(x))+'</div><div class="muted">Status: '+esc(statusSummary(x))+'</div><div class="muted">Comentário: type="file" accept=".csv,.tsv,text/csv,text/tab-separated-values"></div></div>'+table('crit',cols,rows,present?'present':'');var map={fq:'q',fcat:'cat',fc:'classif',fresp:'resp',fs:'status',fd:'deadline'};Object.keys(map).forEach(id=>{var el=document.getElementById(id),key=map[id];el.value=state.filters[key]||'';el.oninput=()=>{state.filters={q:fq.value,cat:fcat.value,classif:fc.value,resp:fresp.value,status:fs.value,deadline:fd.value};criticos()}});critMode.onclick=()=>{document.body.classList.remove('table-fullscreen');state.critView=present?'detail':'present';criticos()};critFull.onclick=()=>{var w=document.getElementById('critTableWrap'),on=!w.classList.contains('is-fullscreen');w.classList.toggle('is-fullscreen',on);document.body.classList.toggle('table-fullscreen',on);critFull.textContent=on?'Sair da tela inteira':'Tela inteira'};if(saveCrit)saveCrit.onclick=saveCritical;if(importCrit)importCrit.onclick=()=>critFile.click();if(critFile)critFile.onchange=importCritical}function filteredCrit(){var f=state.filters;return state.crit.filter(x=>(!f.q||JSON.stringify(x).toLowerCase().includes(f.q.toLowerCase()))&&(!f.cat||x.category===f.cat)&&(!f.classif||x.classification===f.classif)&&(!f.resp||x.responsible===f.resp)&&(!f.status||x.process_status===f.status)&&(!f.deadline||x.deadline_status===f.deadline))}
function editCell(r,k,v){if(!state.admin||state.critView!=='detail'||['risk_summary'].includes(k))return fmt(k,v);var opts={classification:['Alto','Médio','Baixo'],risk_critical:['Alto','Médio','Baixo'],risk_operational:['Alto','Médio','Baixo'],risk_financial:['Alto','Médio','Baixo'],process_status:['Planejado','Em Andamento','Concluido'],deadline_status:['Atrasado','No prazo','Concluido']};if(opts[k])return '<div class="edit-cell"><select data-edit="1" data-key="'+k+'">'+opts[k].map(o=>'<option '+(String(v||'')===o?'selected':'')+'>'+o+'</option>').join('')+'</select></div>';if(['description','attention_point','sourcing_synergy','final_comment'].includes(k))return '<div class="edit-cell"><textarea data-edit="1" data-key="'+k+'">'+esc(v)+'</textarea></div>';return '<div class="edit-cell"><input data-edit="1" data-key="'+k+'" value="'+esc(v)+'"></div>'}async function saveCritical(){try{saveCrit.textContent='Salvando...';var trs=[...document.querySelectorAll('#critTableWrap tbody tr')];for(const tr of trs){var patch={};tr.querySelectorAll('[data-edit]').forEach(el=>patch[el.dataset.key]=el.value);await rpc('csc_update_critical_process',{p_id:tr.dataset.id,p_patch:patch})}authMsg.textContent='Processos críticos salvos.';await load()}catch(e){authMsg.textContent='Erro ao salvar: '+e.message}finally{if(saveCrit)saveCrit.textContent='Salvar alterações'}}function parseDelimited(text){var sep=text.indexOf('\t')>-1?'\t':(text.indexOf(';')>-1?';':','),rows=[],row=[],cell='',q=false;for(var i=0;i<text.length;i++){var c=text[i],n=text[i+1];if(c==='"'&&q&&n==='"'){cell+='"';i++}else if(c==='"'){q=!q}else if(c===sep&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows}function norm(h){return h.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g, function sourcing(){var rows=state.src,months=['Apr','May','Jun','Jul','Aug','Sep','Out–Nov/26','Dec'],max=Math.max(1,...rows.map(x=>Number(x.spend||0)));view.innerHTML='<div class="head"><div><h2>Sourcing Plan &gt;5MM</h2><p class="muted">Visão carregada da guia Sourcing Plan &gt;5MM.</p></div></div><div class="chart"><div class="bars">'+months.map(m=>{var v=sum(rows.filter(x=>x.month===m),'spend');return '<div class="bar" style="height:'+Math.max(2,v/max*240)+'px"><strong>'+(v?'R$'+v.toFixed(1)+'MM':'')+'</strong><span>'+m+'</span></div>'}).join('')+'</div></div>'+table('src',[['Captura','month'],['Iniciativa','initiative'],['Tipo','category'],['Unidades','pillar'],['Spend','spend'],['Owner','owner'],['Gate Atual/Status','gate_status'],['Descrição','scope']],rows)}

function table(key,cols,rows,extraClass){var sort=state.sort[key]||{};var data=[...rows];if(sort.k)data.sort((a,b)=>cmp(a[sort.k],b[sort.k])*(sort.d==='desc'?-1:1));var wrap='table-wrap '+(key==='crit'?'critical-table':'');return '<div class="'+wrap+'" id="'+key+'TableWrap"><table class="'+key+'-table '+(extraClass||'')+'"><thead><tr>'+cols.map(c=>'<th data-table="'+key+'" data-key="'+c[1]+'">'+c[0]+'</th>').join('')+'</tr></thead><tbody>'+data.map(r=>'<tr data-id="'+esc(r.id)+'">'+cols.map(c=>'<td>'+editCell(r,c[1],r[c[1]])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}function fmt(k,v){if(['spend_category','spend_involved','annual_spend','global_value','spend'].includes(k))return esc(money(v));if(['share_percent'].includes(k))return esc(pct(v));if(['status_summary','process_status','deadline_status'].includes(k))return statusBadge(v);return esc(v)}function cmp(a,b){var na=parseFloat(a),nb=parseFloat(b);if(!isNaN(na)&&!isNaN(nb))return na-nb;return String(a||'').localeCompare(String(b||''),'pt-BR')}document.addEventListener('click',e=>{if(e.target.tagName==='TH'){var t=e.target.dataset.table,k=e.target.dataset.key,stateSort=state.sort[t]||{};state.sort[t]={k:k,d:stateSort.k===k&&stateSort.d==='asc'?'desc':'asc'};({crit:criticos,src:sourcing,gates:gates})[t]();}});
function authError(d,status){var m=String((d&&d.error_description)||(d&&d.msg)||(d&&d.message)||'').toLowerCase();if(status===400&&m.includes('invalid login'))return 'E-mail ou senha incorretos. Se ainda não definiu senha, use o botão de link abaixo.';if(m.includes('email not confirmed'))return 'E-mail ainda não confirmado no Supabase Auth. Confirme o usuário no painel ou pelo convite recebido.';if(m.includes('user not found')||m.includes('not found'))return 'Usuário ainda não existe em Authentication > Users. Crie ou envie convite pelo Supabase.';return 'Não foi possível autenticar. Confira se o usuário existe, está confirmado e se a senha está correta.'}async function login(){var mail=email.value.trim().toLowerCase();if(adminEmails.indexOf(mail)<0){authMsg.textContent='Este e-mail não está liberado como admin neste cockpit.';return}if(state.recovery)return updatePassword();try{authMsg.textContent='Validando acesso admin...';var r=await fetch(SUPA+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:mail,password:password.value})}),d=await r.json();if(!r.ok)throw {data:d,status:r.status};token=d.access_token;localStorage.setItem('csc_token',token);state.admin=true;authMsg.textContent='Admin autenticado.';render()}catch(e){authMsg.textContent=authError(e.data,e.status)}}async function sendReset(){var mail=email.value.trim().toLowerCase();if(adminEmails.indexOf(mail)<0){authMsg.textContent='Informe o e-mail admin liberado: wagnerdj@suzano.com.br';return}try{resetBtn.textContent='Enviando...';var r=await fetch(SUPA+'/auth/v1/recover',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:mail,redirect_to:location.origin+location.pathname})}),d=await r.json().catch(()=>({}));if(!r.ok)throw {data:d,status:r.status};authMsg.textContent='Se o usuário existir no Supabase Auth, o link para definir senha será enviado para este e-mail.'}catch(e){authMsg.textContent=authError(e.data,e.status)}finally{resetBtn.textContent='Enviar link para definir senha'}}async function updatePassword(){if(!token){authMsg.textContent='Link de recuperação inválido ou expirado. Solicite um novo link.';return}if(!password.value||password.value.length<8){authMsg.textContent='Digite uma nova senha com pelo menos 8 caracteres.';return}try{loginBtn.textContent='Salvando...';var r=await fetch(SUPA+'/auth/v1/user',{method:'PUT',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({password:password.value})}),d=await r.json().catch(()=>({}));if(!r.ok)throw {data:d,status:r.status};state.recovery=false;state.admin=true;localStorage.setItem('csc_token',token);history.replaceState(null,'',location.pathname+location.search);authMsg.textContent='Senha definida. Admin autenticado.';render()}catch(e){authMsg.textContent='Não consegui salvar a senha. O link pode ter expirado; envie um novo link.'}finally{loginBtn.textContent='Entrar para editar'}}function readAuthReturn(){var p=new URLSearchParams(location.hash.replace(/^#/,''));if(p.get('access_token')){token=p.get('access_token');localStorage.setItem('csc_token',token);state.recovery=p.get('type')==='recovery';password.value='';authMsg.textContent=state.recovery?'Digite uma nova senha e clique em Salvar nova senha.':'Sessão recebida do Supabase.'}}function logout(){token='';localStorage.removeItem('csc_token');state.admin=false;state.recovery=false;authMsg.textContent='Visualização pública sem login.';render()}loginBtn.onclick=login;resetBtn.onclick=sendReset;logoutBtn.onclick=logout;theme.onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('csc_theme',document.body.classList.contains('dark')?'dark':'light');theme.textContent=document.body.classList.contains('dark')?'Tela clara':'Tela escura'};if(localStorage.getItem('csc_theme')==='dark'){document.body.classList.add('dark');theme.textContent='Tela clara'}readAuthReturn();load()
