<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cockpit de Serviços Corporativos</title><style>
:root{--bg:#eef2f6;--panel:#fff;--panel2:#f7fafc;--text:#172033;--muted:#61708a;--line:#d9e1ec;--brand:#123c69;--accent:#0f6b7a;--quad:#edf2ff;--ok:#ecfdf5;--warn:#fff7ed;--bad:#fff1f2;--shadow:0 10px 30px rgba(23,32,51,.08)}body.dark{--bg:#0f1720;--panel:#16202c;--panel2:#1d2a38;--text:#e7eef8;--muted:#9fb0c3;--line:#334155;--brand:#6ea8fe;--accent:#67e8f9;--quad:#17233c;--ok:#12352d;--warn:#3d2b16;--bad:#3d1821;--shadow:none}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,system-ui,sans-serif;color:var(--text);background:var(--bg)}button,input,select{font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);min-height:38px;padding:0 12px}button{cursor:pointer;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px}.primary,.active{background:var(--brand);color:#fff;border-color:var(--brand)}.shell{display:grid;grid-template-columns:285px minmax(0,1fr);min-height:100vh}.side{background:var(--panel);border-right:1px solid var(--line);padding:22px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:12px;align-items:center}.mark{width:44px;height:44px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:900}.brand strong,.brand small{display:block}.muted,.brand small{color:var(--muted)}nav{display:grid;gap:8px}nav button{justify-content:flex-start}.auth{margin-top:auto;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:10px}input,select{width:100%;padding:9px 12px}main{padding:28px;min-width:0}.top,.head,.banner{display:flex;align-items:center;justify-content:space-between;gap:16px}.eyebrow{margin:0 0 4px;color:var(--accent);text-transform:uppercase;font-size:.74rem;font-weight:900}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(1.7rem,3vw,2.4rem);margin-bottom:0}.tag{font-size:.73rem;font-weight:900;color:var(--accent)}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:20px 0}.metric,.card,.chart,.table-wrap,.tool,.file,.lane,.routine,.filterbar{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}.metric{padding:18px}.metric span{color:var(--muted);font-size:.8rem;font-weight:800}.metric strong{display:block;margin-top:8px;font-size:1.45rem}.stack{display:grid;gap:18px}.banner{padding:22px;border-radius:8px;background:var(--brand);color:#fff}.banner.light{background:var(--panel);color:var(--text);border:1px solid var(--line)}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card,.tool,.file,.lane,.routine,.filterbar{padding:18px}.col{padding:12px;border-radius:8px;background:var(--panel2);margin-top:10px}.warn{background:var(--warn)}.ok{background:var(--ok)}.bad{background:var(--bad)}.col ul{margin:8px 0 0;padding-left:18px}.col li{margin:6px 0}.flow{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.step{padding:12px;background:var(--panel2);border:1px solid var(--line);border-radius:8px}.step strong{display:block;color:var(--brand)}.routine-grid,.risk,.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.filters{grid-template-columns:1.5fr repeat(4,1fr)}.legal{padding:20px;border-radius:8px;background:var(--bad);border:1px solid #fecdd3;color:#be123c}.check{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;border-top:1px solid var(--line);padding:12px 0}.info{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;background:var(--panel2);border:1px solid var(--line);font-size:.78rem;font-weight:900;color:var(--accent);margin-left:6px}.matrix-shell{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:center}.ylabel{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:900;color:#0b1b63;text-align:center}.matrix{height:420px;border:1px solid var(--line);background:linear-gradient(90deg,transparent 0 49.7%,var(--line) 49.7% 50.3%,transparent 50.3%),linear-gradient(0deg,transparent 0 49.7%,var(--line) 49.7% 50.3%,transparent 50.3%);position:relative;background-color:var(--panel)}.matrix:after{content:"Foco da liderança";position:absolute;right:20px;top:18px;color:#1d4ed8;font-weight:900;font-size:.9rem}.focus{position:absolute;right:0;top:0;width:50%;height:50%;background:var(--quad);z-index:0}.axisnote{display:flex;justify-content:space-between;color:var(--muted);font-size:.75rem;margin:6px 0 0 44px}.xlabel{text-align:center;font-weight:900;margin-top:8px}.dot{position:absolute;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:.78rem;font-weight:900;transform:translate(-50%,50%);box-shadow:0 0 0 4px var(--panel);z-index:2}.dot:hover .tip{display:block}.tip{display:none;position:absolute;left:40px;top:-12px;width:320px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;box-shadow:var(--shadow);font-weight:500;text-align:left;z-index:10}.tip strong{display:block;margin-bottom:4px}.risk-critical,.leg-critical{background:#e91e63}.risk-operational,.leg-operational{background:#1d4ed8}.risk-financial,.leg-financial{background:#d99a09}.risk-balanced{background:#6b5bd2}.legend{display:grid;grid-template-columns:160px 1fr;gap:10px 22px;max-width:720px;margin:18px 0 0 44px}.leg{width:10px;height:10px;display:inline-block;margin-right:10px}.bars{height:280px;display:flex;align-items:end;gap:8px;border-bottom:1px solid var(--line);padding-top:24px}.bar{flex:1;background:#2563eb;border-radius:4px 4px 0 0;min-height:2px;position:relative}.bar span{position:absolute;bottom:-24px;left:50%;transform:translateX(-50%);font-size:.75rem}.bar strong{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:.7rem;white-space:nowrap}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1120px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:.72rem;text-transform:uppercase;color:var(--muted);background:var(--panel2);cursor:pointer;white-space:nowrap}td{font-size:.9rem}.hidden{display:none}.actions{display:flex;gap:10px;flex-wrap:wrap}.drive{color:inherit;font-weight:900}@media(max-width:980px){.shell{grid-template-columns:1fr}.side{position:static;height:auto}.metrics,.grid2,.grid3,.routine-grid,.risk,.flow,.filters{grid-template-columns:1fr}main,.side{padding:16px}.top,.head,.banner{align-items:stretch;flex-direction:column}.matrix{height:360px}.tip{width:260px}.legend{grid-template-columns:1fr}}
</style></head><body><div class="shell"><aside class="side"><div class="brand"><span class="mark">SC</span><div><strong>Cockpit Serv. Corp</strong><small>Suzano | Serviços Corporativos</small></div></div><button id="theme">Tela escura</button><nav id="nav"></nav><section class="auth"><strong id="authTitle">Login admin</strong><input id="email" placeholder="e-mail admin"><input id="password" type="password" placeholder="senha"><button id="loginBtn" class="primary">Entrar para editar</button><button class="hidden" id="logoutBtn">Sair</button><small id="authMsg" class="muted">Visualização pública sem login.</small></section></aside><main><header class="top"><div><p class="eyebrow">Cockpit de Serviços Corporativos</p><h1 id="title"></h1></div><span class="tag">Público para visualização</span></header><section class="metrics" id="metrics"></section><section id="view" class="stack"></section></main></div><script>
(function(){var SUPA='https://reebavnvftfibyhhjxat.supabase.co',KEY='sb_publishable_WksWBZLsVc1f4JBmQiRK5A_6swUYr-Z',token=localStorage.getItem('csc_token')||'',adminEmails=['wagnerdj@suzano.com.br'];var state={tab:'processos',admin:false,crit:[],src:[],gates:[],files:[],sort:{},filters:{q:'',risk:'',classif:'',status:'',deadline:''}};var tabs={processos:'Processos & Rotinas',toolkit:'Tool Kit e Radar',criticos:'Processos críticos',sourcing:'Visão sourcing',gates:'Calendário de gates'};var sharepoint='https://suzano.sharepoint.com/sites/SupriADMDigitalTech/Documentos%20Compartilhados/Forms/AllItems.aspx?TeamsCID=8995a6d8%2Dfb49%2D45e5%2D867a%2Dd062dd9f0096';
var processBlocks=[['Gestão da Demanda e Pipeline',['Gestão estruturada da demanda a partir do Plano Base, calendário de categorias e demandas das áreas clientes.','Pipeline único, com visibilidade de requisições, contratos a vencer, temas estruturantes e demandas não planejadas.'],['Ausência de Sourcing Plan integrado.','Oportunidade de, sempre que possível, antecipar o planejamento das demandas.','Oportunidade de maior uso do Farol de Contratos e de KPIs alinhados com a célula de gestão.'],['Rotina de leitura do Sourcing Monitor para enxergar processos futuros e riscos de capacidade.','Célula de gestão cruzando Sourcing Monitor, Farol de Contratos, saldo/vigência e status de requisição.','Agenda quadrimestral com áreas clientes para antecipar temas estruturantes e alimentar o cockpit.']],['Governança e Priorização',['Entendimento da demanda, classificação de criticidade, definição do fórum adequado, stage gates e formalização.'],['Critérios de criticidade pouco explícitos.','Escalonamento tardio de iniciativas estratégicas, complexas ou de alto valor.'],['Processos de R$5MM a R$15MM por valor global devem ser deliberados por e-mail, com racional documentado.','Processos acima de R$15MM devem passar por gate com o GE da área.','Gate de Estratégia acontece antes da RFQ: alinha demanda, categoria, escopo, especificações, mercado, vendor list, estratégia inicial e premissas comerciais antes de ir ao mercado.','Gate de Negociação/Fechamento valida recomendação, estratégia de negociação, últimos ajustes, plano de implementação e subida de alçadas.','Processos acima de R$15MM devem ter ficha-resumo preparada para sequenciamento de assinatura no CLM, conforme modelo do toolkit.','Todos os arquivos do processo devem ficar no drive da área: <a class="drive" target="_blank" href="'+sharepoint+'">abrir repositório oficial</a>.']],['Gestão de Categorias e Ciclo Básico do Contrato',['Agenda contínua com clientes internos, leitura de categoria e gestão do ciclo de vida contratual.','Gestão de saldo, vigência, aditivos, pré-renovação e retroalimentação do pipeline.'],['Base contratual, saldo e alarmística ainda podem ser mais integrados à gestão semanal.','Renovações, rebids e encerramentos precisam ser antecipados com maior previsibilidade.'],['Célula de gestão sustenta cadastro, qualidade da base, controle de saldo/vigência, alarmes e encaminhamento para aditivar, rebidar, renovar ou encerrar.','GCATs e célula atuam juntos para reduzir ruptura, organizar handover e padronizar templates, SLAs e controles.']],['Gestão, Indicadores e Liderança',['Liderança direciona o time por indicadores, inteligência de mercado, criticidade, riscos e governança.'],['Oportunidade de ajustar agendas para que processos, riscos e decisões apareçam no dia a dia, e não apenas no fechamento do mês.'],['Gestão à vista dos gates, sourcing, críticos, indicadores, pendências da célula de gestão e plano de ação.','Ritos semanais, mensais e trimestrais conectados a decisões, priorização e desenvolvimento do time.']]];
var cellSteps=['B0 Cadastro e classificação da base por criticidade, risco e contingência.','B1 Controle de saldo total, consumido, reservado, disponível e prazo restante.','B2 Previsão de consumo, ruptura, sobre/subutilização e necessidade de RC/FRS.','B3 Acompanhamento de prazo contratual, handover e pendências operacionais.','B4 Alarmística e escalonamento de vencimentos/saldos em 180/90/60 dias.','B5 Definição de tratativa: aditivar, rebidar, renovar, encerrar ou acionar gate 0.'];var cellRoles=['Criar AFs, aditivos, reajustes e encerramentos no ERP com templates e workflow via Planner.','Manter contratos, pedidos, SoulPlan, RCs e FRS saneados e atualizados.','Monitorar pré-renovações, consumo, saldo, vencimentos, rupturas e pendências com áreas clientes.','Conduzir ritos semanais com GCATs para prioridades, urgências e plano de ação.','Acompanhar KPIs, riscos, governança, matriz RACI, qualidade de base e escalations.','Coordenar handover por unidade, padronizar templates, SLAs, processos e benchmarks.'];var routines=[['Semanal','1:1s para direcionamento, destravamento e touch de gestão. Reunião semanal para recados, gates, críticos, agenda, plano de ação e follow-up da célula.'],['Mensal','Performance com Ns de Suprimentos e áreas. Touch com guardiões de Sourcing Monitor, PB/RF & Metas, Matricial e CLM.'],['Trimestral','Agenda estruturante, projetos, metas, direcionamentos, engajamento, feedback, PDI e carreira.']];var toolkit=[['Approach de Base','Resumo executivo do escopo','Categoria, descrição, valor PB, baseline/real, vigência, prazo de pagamento, subcontratação, paramétrica, cláusula de saída, take or pay, SLAs e pontos jurídicos.','Consolida os fatos mínimos para liderança entender tamanho, prazo, risco e decisão necessária.'],['Approach de Base','Resumo da categoria','Spend total, share por unidade de negócio, fornecedor e unidade; fatia endereçada e destino esperado.','Mostra relevância da categoria e quanto do spend está em negociação.'],['Approach de Base','Entendimento do escopo','Local, serviços pedidos, quantitativos, cenário atual de fornecimento e premissas operacionais.','Evita comparar propostas desalinhadas e separa preço de volume/demanda.'],['Approach do Processo','Mercado e vendor list','Dinâmica de mercado, oferta, representatividade Suzano, barganha, drivers, vendor list e cenário oferta/demanda.','Base para concorrência, BATNA, riscos de fornecedor e estratégia de negociação.'],['Approach do Processo','Parecer técnico, Linkana e performance','Resumo técnico, avaliação de fornecedores, compliance, saúde cadastral e SLAs/performance atuais quando houver.','Suporta recomendação comercial por capacidade técnica, risco e histórico.'],['Approach do Processo','Cost breakdown, MCC e cenários','Escopo, preços unitários/totais, MCC, Plano Base, Real, should cost e cenários equalizados.','Compara fornecedores em base equivalente e isola preço, volume e escopo.'],['Approach do Processo','Alavancas e recomendação','Alavancas exploradas, recomendação comercial, mapa final do processo e próximos passos de implementação.','Transforma análise em decisão e plano de execução.'],['Approach para Ativos','Ativos, rental/buy e paramétrica','Composição do ativo no CBD, comparação rental/buy, remuneração do ativo no contrato e cuidado para não remunerar duas vezes via paramétrica.','Necessário quando há CAPEX/ativo, frota, equipamentos, mobilização ou remuneração financeira relevante.']];
async function api(table,opt){opt=opt||{};var method=opt.method||'GET',url=SUPA+'/rest/v1/'+table+(method==='GET'?'?select=*&order=created_at.asc':'');var h={apikey:KEY,Authorization:'Bearer '+(token||KEY),'Content-Type':'application/json',Prefer:'return=representation'};var r=await fetch(url,{method:method,headers:h,body:opt.body?JSON.stringify(opt.body):undefined});if(!r.ok)throw Error(await r.text());return method==='DELETE'?[]:r.json()}async function load(){try{var r=await Promise.all([api('csc_critical_processes'),api('csc_sourcing_processes'),api('csc_gate_events'),api('csc_inspiration_files')]);state.crit=r[0];state.src=r[1];state.gates=r[2];state.files=r[3]}catch(e){console.warn(e)}render()}function esc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function sum(a,k){return a.reduce((s,x)=>s+Number(x[k]||0),0)}function money(v){return v==null||v===''?'N/A':'R$'+Number(v).toFixed(1)+'MM'}function pct(v){return v==null||v===''?'N/A':Number(v).toFixed(1)+'%'}function metric(a,b){return '<article class="metric"><span>'+a+'</span><strong>'+b+'</strong></article>'}function render(){authTitle.textContent=state.admin?'Admin autenticado':'Login admin';logoutBtn.classList.toggle('hidden',!state.admin);nav.innerHTML=Object.keys(tabs).map(k=>'<button class="'+(state.tab===k?'active':'')+'" data-tab="'+k+'">'+tabs[k]+'</button>').join('');document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});title.textContent=tabs[state.tab];metrics.innerHTML=metric('Críticos abertos',state.crit.filter(x=>x.status!=='Concluído').length)+metric('Spend sourcing >5MM','R$'+sum(state.src,'spend').toFixed(1)+'MM')+metric('Processos >5MM',state.src.length)+metric('Gates pendentes',state.gates.filter(x=>x.negotiation_status==='Pendente'||x.strategy_status==='Pendente').length);({processos,toolkit:toolkitPage,criticos,sourcing,gates})[state.tab]()}function col(t,a,c){return '<div class="col '+(c||'')+'"><strong>'+t+'</strong><ul>'+a.map(x=>'<li>'+x+'</li>').join('')+'</ul></div>'}
function processos(){view.innerHTML='<div class="banner"><div><p class="eyebrow">Modelo operacional</p><h2>Rotina integrada para antecipar demandas, priorizar decisões e proteger o ciclo contratual.</h2></div><button id="goGate">Ver calendário de gates</button></div><div class="grid2">'+processBlocks.map(b=>'<article class="card"><h3>'+b[0]+'</h3>'+col('Processo esperado',b[1])+col('Gaps / oportunidades',b[2],'warn')+col('To be proposto',b[3],'ok')+'</article>').join('')+'</div><section class="card"><p class="eyebrow">Célula de Gestão</p><h2>Gestão operacional, governança e suporte aos GCATs</h2><p class="muted">A célula não cuida apenas de contratos: ela organiza dados, pendências, RCs/FRS, prazos, saldo, handover, KPIs, riscos, governança e padronização operacional para dar previsibilidade ao time.</p><div class="flow">'+cellSteps.map(x=>'<div class="step"><strong>'+x.slice(0,2)+'</strong><span>'+x.slice(3)+'</span></div>').join('')+'</div><div class="grid2" style="margin-top:14px">'+cellRoles.map(x=>'<div class="col">'+x+'</div>').join('')+'</div></section><section><p class="eyebrow">Rotinas</p><h2>Dinâmica das reuniões</h2><div class="routine-grid">'+routines.map(r=>'<article class="routine"><h3>'+r[0]+'</h3><p class="muted">'+r[1]+'</p></article>').join('')+'</div></section>';goGate.onclick=()=>{state.tab='gates';render()}}
function toolkitPage(){view.innerHTML='<div class="legal"><strong>Minuta jurídica é elemento do processo.</strong><span>Comece na Etapa de Base. Deixar para o final atrasa CLM e aumenta risco de fornecimento.</span></div><div class="banner light"><div><p class="eyebrow">Toolkit consultivo</p><h2>Checklist não exaustivo organizado por approach.</h2></div><button id="down">Exportar checklist</button></div><div class="grid3">'+['Approach de Base','Approach do Processo','Approach para Ativos'].map(g=>'<section class="tool"><h3>'+g+'</h3>'+toolkit.filter(x=>x[0]===g).map(x=>'<div class="check"><div><strong>'+x[1]+' <span class="info" title="'+esc(x[3])+'">i</span></strong><p class="muted">'+x[2]+'</p></div><span class="tag">check</span></div>').join('')+'</section>').join('')+'</div>';down.onclick=downloadChecklist}function downloadChecklist(){var rows=[['Cluster','Item','Descrição','Como usar']].concat(toolkit.map(x=>[x[0],x[1],x[2],x[3]]));var csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='checklist-toolkit-servicos-corporativos.csv';a.click()}
function riskClass(x){var vals={critical:score(x.risk_critical),operational:score(x.risk_operational),financial:score(x.risk_financial)},m=Math.max(vals.critical,vals.operational,vals.financial),tops=Object.keys(vals).filter(k=>vals[k]===m);return tops.length>1?'balanced':tops[0]}function score(x){return x==='Alto'?3:x==='Médio'?2:1}function dotTitle(x){return esc((x.matrix_number||'')+' - '+x.category+'\nResponsável: '+(x.responsible||x.owner||'')+'\nClassificação: '+(x.classification||'')+' | Prazo: '+(x.deadline_status||'')+'\n'+(x.description||''))}
function criticos(){var rows=filteredCrit();view.innerHTML='<div class="matrix-shell"><div class="ylabel">Criticidade</div><div><div class="matrix"><div class="focus"></div>'+state.crit.filter(x=>x.status!=='Concluído').map(x=>{var cls='risk-'+riskClass(x),left=Math.min(94,Math.max(6,Number(x.urgency||1)*19)),bottom=Math.min(94,Math.max(6,Number(x.criticality||1)*19));return '<div class="dot '+cls+'" style="left:'+left+'%;bottom:'+bottom+'%" title="'+dotTitle(x)+'">'+(x.matrix_number||'')+'<div class="tip"><strong>'+esc(x.matrix_number+' - '+x.category)+'</strong><div>'+esc(x.description)+'</div><div class="muted">Responsável: '+esc(x.responsible||x.owner)+'</div><div class="muted">Riscos: '+esc(x.noise)+'</div><div class="muted">Comentário: '+esc(x.final_comment||x.action_plan)+'</div></div></div>'}).join('')+'</div><div class="axisnote"><span>Baixa</span><span>Alta</span></div><div class="xlabel">Urgência</div></div></div><div class="legend"><strong>Critérios de leitura</strong><span></span><b><span class="leg leg-critical"></span>Ruído crítico</b><span>Produção, ESG, compliance, auditoria, imagem ou ruptura regulatória.</span><b><span class="leg leg-operational"></span>Ruído operacional</b><span>Satisfação do cliente interno, clima, continuidade, qualidade e performance operacional.</span><b><span class="leg leg-financial"></span>Ruído financeiro</b><span>Impacto econômico, perda de captura, pleitos, atrasos ou desalinhamento com a estratégia corporativa.</span></div><div class="filterbar"><div class="filters"><input id="fq" placeholder="Buscar processo, responsável, comentário"><select id="fr"><option value="">Risco</option><option>Alto</option><option>Médio</option><option>Baixo</option></select><select id="fc"><option value="">Classificação</option><option>Alto</option><option>Médio</option><option>Baixo</option></select><select id="fs"><option value="">Status</option><option>Em Andamento</option><option>Planejado</option><option>Concluido</option></select><select id="fd"><option value="">Prazo</option><option>Atrasado</option><option>No prazo</option><option>Concluido</option></select></div></div>'+table('crit',[['#','matrix_number'],['Categoria','category'],['Descrição','description'],['Spend Categoria','spend_category'],['Spend Envolvido','spend_involved'],['Share','share_percent'],['Ponto de Atenção','attention_point'],['Ruído Crítico','risk_critical'],['Ruído Operacional','risk_operational'],['Ruído Financeiro','risk_financial'],['Classificação','classification'],['Responsável','responsible'],['Sinergia Sourcing','sourcing_synergy'],['Comentário Final','final_comment'],['Data Planejada','planned_capture_date'],['Data Estimada','estimated_capture_date'],['Status','process_status'],['Prazo','deadline_status']],rows);['fq','fr','fc','fs','fd'].forEach(id=>{var el=document.getElementById(id);el.oninput=()=>{state.filters={q:fq.value,risk:fr.value,classif:fc.value,status:fs.value,deadline:fd.value};criticos()};el.value=state.filters[id.slice(1)]||state.filters.q||''});}function filteredCrit(){var f=state.filters;return state.crit.filter(x=>(!f.q||JSON.stringify(x).toLowerCase().includes(f.q.toLowerCase()))&&(!f.risk||[x.risk_critical,x.risk_operational,x.risk_financial].includes(f.risk))&&(!f.classif||x.classification===f.classif)&&(!f.status||x.process_status===f.status)&&(!f.deadline||x.deadline_status===f.deadline))}
function sourcing(){var rows=state.src,months=['Apr','May','Jun','Jul','Aug','Sep','Out–Nov/26','Dec'],max=Math.max(1,...rows.map(x=>Number(x.spend||0)));view.innerHTML='<div class="head"><div><h2>Sourcing Plan &gt;5MM</h2><p class="muted">Visão carregada da guia Sourcing Plan &gt;5MM.</p></div></div><div class="chart"><div class="bars">'+months.map(m=>{var v=sum(rows.filter(x=>x.month===m),'spend');return '<div class="bar" style="height:'+Math.max(2,v/max*240)+'px"><strong>'+(v?'R$'+v.toFixed(1)+'MM':'')+'</strong><span>'+m+'</span></div>'}).join('')+'</div></div>'+table('src',[['Captura','month'],['Iniciativa','initiative'],['Tipo','category'],['Unidades','pillar'],['Spend','spend'],['Owner','owner'],['Gate Atual/Status','gate_status'],['Descrição','scope']],rows)}
function gates(){view.innerHTML='<div class="head"><div><h2>Calendário de gates</h2><p class="muted">Tabela integral com ordenação por coluna.</p></div></div>'+table('gates',[['Iniciativa','initiative'],['Categoria','category'],['Pilar','pillar'],['Cliente','client'],['Vencimento','expiration'],['Owner','owner'],['Spend Ano','annual_spend'],['Duração Contrato','contract_years'],['Valor Global','global_value'],['Gate Estratégia','strategy_gate'],['Status Estratégia','strategy_status'],['Gate Negociação/Aprovação','negotiation_gate'],['Status Negociação','negotiation_status']],state.gates)}
function table(key,cols,rows){var sort=state.sort[key]||{};var data=[...rows];if(sort.k)data.sort((a,b)=>cmp(a[sort.k],b[sort.k])*(sort.d==='desc'?-1:1));return '<div class="table-wrap"><table><thead><tr>'+cols.map(c=>'<th data-table="'+key+'" data-key="'+c[1]+'">'+c[0]+'</th>').join('')+'</tr></thead><tbody>'+data.map(r=>'<tr>'+cols.map(c=>'<td>'+fmt(c[1],r[c[1]])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}function fmt(k,v){if(['spend_category','spend_involved','annual_spend','global_value','spend'].includes(k))return esc(money(v));if(['share_percent'].includes(k))return esc(pct(v));return esc(v)}function cmp(a,b){var na=parseFloat(a),nb=parseFloat(b);if(!isNaN(na)&&!isNaN(nb))return na-nb;return String(a||'').localeCompare(String(b||''),'pt-BR')}document.addEventListener('click',e=>{if(e.target.tagName==='TH'){var t=e.target.dataset.table,k=e.target.dataset.key,stateSort=state.sort[t]||{};state.sort[t]={k:k,d:stateSort.k===k&&stateSort.d==='asc'?'desc':'asc'};({crit:criticos,src:sourcing,gates:gates})[t]();}});
async function login(){var mail=email.value.trim().toLowerCase();if(adminEmails.indexOf(mail)<0){authMsg.textContent='Use o e-mail admin liberado: wagnerdj@suzano.com.br';return}try{var r=await fetch(SUPA+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:mail,password:password.value})}),d=await r.json();if(!r.ok)throw Error();token=d.access_token;localStorage.setItem('csc_token',token);state.admin=true;authMsg.textContent='Admin autenticado.';render()}catch(e){authMsg.textContent='Confirme usuário/senha no Supabase Auth.'}}function logout(){token='';localStorage.removeItem('csc_token');state.admin=false;authMsg.textContent='Visualização pública sem login.';render()}loginBtn.onclick=login;logoutBtn.onclick=logout;theme.onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('csc_theme',document.body.classList.contains('dark')?'dark':'light');theme.textContent=document.body.classList.contains('dark')?'Tela clara':'Tela escura'};if(localStorage.getItem('csc_theme')==='dark'){document.body.classList.add('dark');theme.textContent='Tela clara'}load();})();
</script></body></html>
