var processBlocks=[['Gestão da Demanda e Pipeline',['Gestão estruturada da demanda a partir do Plano Base, calendário de categorias e demandas das áreas clientes.','Pipeline único, com visibilidade de requisições, contratos a vencer, temas estruturantes e demandas não planejadas.'],['Ausência de Sourcing Plan integrado.','Oportunidade de, sempre que possível, antecipar o planejamento das demandas.','Oportunidade de maior uso do Farol de Contratos e de KPIs alinhados com a célula de gestão.'],['Rotina de leitura do Sourcing Monitor para enxergar processos futuros e riscos de capacidade.','Célula de gestão cruzando Sourcing Monitor, Farol de Contratos, saldo/vigência e status de requisição.','Rotina de agendas internas e externas para antecipar demandas e temas estruturantes e alimentar o cockpit.']],['Governança e Priorização',['Entendimento da demanda, classificação de criticidade, definição do fórum adequado, stage gates e formalização.'],['Critérios de criticidade pouco explícitos.','Escalonamento tardio de iniciativas estratégicas, complexas ou de alto valor.'],['Processos de R$5MM a R$15MM por valor global devem ser deliberados por e-mail, com racional documentado e apoio dos toolkits.','Processos acima de R$15MM devem passar por gate com o GE da área.','Gate de Estratégia acontece antes da RFQ: alinha demanda, categoria, escopo, especificações, mercado, vendor list, estratégia inicial e premissas comerciais antes de ir ao mercado.','Gate de Negociação/Fechamento valida recomendação, estratégia de negociação, últimos ajustes, plano de implementação e subida de alçadas.','Processos acima de R$15MM devem ter ficha-resumo preparada para sequenciamento de assinatura no CLM, conforme modelo do toolkit.','Todos os arquivos do processo devem ficar no drive da área: <a class="drive" target="_blank" href="'+sharepoint+'">abrir repositório oficial</a>.']],['Gestão de Categorias e Ciclo Básico do Contrato',['Agenda contínua com clientes internos, leitura de categoria e gestão do ciclo de vida contratual.','Gestão de saldo, vigência, aditivos, pré-renovação e retroalimentação do pipeline.'],['Base contratual, saldo e alarmística ainda podem ser mais integrados à gestão semanal.','Renovações, rebids e encerramentos precisam ser antecipados com maior previsibilidade.'],['Célula de gestão sustenta cadastro, qualidade da base, controle de saldo/vigência, alarmes e encaminhamento para aditivar, rebidar, renovar ou encerrar.','GCATs e célula atuam juntos para reduzir ruptura, organizar handover e padronizar templates, SLAs e controles.']],['Gestão, Indicadores e Liderança',['Liderança direciona o time por indicadores, inteligência de mercado, criticidade, riscos e governança.'],['Oportunidade de ajustar agendas para que processos, riscos e decisões apareçam no dia a dia, e não apenas no fechamento do mês.'],['Gestão à vista dos gates, sourcing, críticos, indicadores, pendências da célula de gestão e plano de ação.','Ritos semanais, mensais e quadrimestrais conectados a decisões, priorização e desenvolvimento do time.']]];
var cellSteps=['B0 Cadastro e classificação da base por criticidade, risco e contingência.','B1 Controle de saldo total, consumido, reservado, disponível e prazo restante.','B2 Previsão de consumo, ruptura, sobre/subutilização e necessidade de RC/FRS.','B3 Acompanhamento de prazo contratual, handover e pendências operacionais.','B4 Alarmística e escalonamento de vencimentos/saldos em 180/90/60 dias.','B5 Definição de tratativa: aditivar, rebidar, renovar, encerrar ou acionar gate 0.'];var cellRoles=['Criar AFs, aditivos, reajustes e encerramentos no ERP com templates e workflow via Planner.','Manter contratos, pedidos, SoulPlan, RCs e FRS saneados e atualizados.','Monitorar pré-renovações, consumo, saldo, vencimentos, rupturas e pendências com áreas clientes.','Conduzir ritos semanais com GCATs para prioridades, urgências e plano de ação.','Acompanhar KPIs, riscos, governança, matriz RACI, qualidade de base e escalations.','Coordenar handover por unidade, padronizar templates, SLAs, processos e benchmarks.'];var routines=[['Semanal',['1:1s para direcionamento, destravamento e touch de gestão.','Reunião semanal para recados, gates, críticos, agenda, plano de ação e follow-up da célula.']],['Mensal',['Performance com Ns de Suprimentos.','Agenda das áreas (Tech, Facilities e outras).','Touch com guardiões de Sourcing Monitor, PB/RF & Metas, Matricial e CLM.']],['Quadrimestral',['Agenda estruturante, projetos, metas e direcionamentos.']],['Carreira',['Feedback, PDI e carreira.'],'Bimestral/Trimestral']];var toolkit=[['Approach de Base','Resumo executivo do escopo','Categoria, descrição, valor PB, baseline/real, vigência, prazo de pagamento, subcontratação, paramétrica, cláusula de saída, take or pay, SLAs e pontos jurídicos.','Consolida os fatos mínimos para liderança entender tamanho, prazo, risco e decisão necessária.'],['Approach de Base','Resumo da categoria','Spend total, share por unidade de negócio, fornecedor e unidade; fatia endereçada e destino esperado.','Mos function gates(){var rows=filteredGates(),present=state.gateView!=='detail',cols=present?[["Iniciativa","initiative"],["Categoria","category"],["Cliente","client"],["Owner","owner"],["Valor Global","global_value"],["Gate Estratégia","strategy_gate"],["Status Estratégia","strategy_status"],["Data limite negociação/aprovação","negotiation_gate"],["Status Negociação","negotiation_status"]]:[["Iniciativa","initiative"],["Categoria","category"],["Pilar","pillar"],["Cliente","client"],["Vencimento","expiration"],["Owner","owner"],["Spend Ano","annual_spend"],["Duração Contrato","contract_years"],["Valor Global","global_value"],["Gate Estratégia","strategy_gate"],["Status Estratégia","strategy_status"],["Data limite negociação/aprovação","negotiation_gate"],["Status Negociação","negotiation_status"]],recos=[['Processos entre R$15MM e R$25MM',['Gate de Estratégia: antes da RFQ, alinhar demanda, escopo, mercado, vendor list, estratégia inicial e premissas comerciais. Referência: 4 a 5 meses / 150 a 120 dias.','Gate de Negociação/Fechamento: validar recomendação, estratégia de negociação, últimos ajustes, implementação e alçadas. Referência: 3 a 2 meses / 90 a 60 dias.']],['Processos acima de R$20MM',['Gate de Estratégia: antecipar alinhamento completo antes da RFQ. Referência: 6 a 7 meses / 180 a 210 dias.','Gate de Negociação/Fechamento: validar recomendação e plano de implementação com mais antecedência. Referência: 3 meses / 90 dias.']],['Mobilização/desmobilização complexa, muitos ativos ou alta complexidade operacional',['Gate de Estratégia: antecipar escopo, modelo operacional, transição, ativos, riscos e vendor list. Referência: 8 a 12 meses.','Gate de Negociação/Fechamento: fechar recomendação, plano de transição, alçadas e riscos residuais. Referência: 5 a 6 meses.']]];view.innerHTML='<section class="card"><div class="head"><div><h2>Recomendação de execução dos gates</h2><p class="muted">Selecione a faixa do processo para ver a antecedência recomendada.</p></div><select id="gateReco">'+recos.map((r,i)=>'<option value="'+i+'">'+r[0]+'</option>').join('')+'</select></div><div id="gateRecoBox" class="col ok"></div><p class="muted">Os prazos podem variar conforme a complexidade da carteira. Cabe ao gestor da categoria posicionar os tempos necessários e acionar a governança com antecedência.</p></section><div class="filterbar"><div class="filters gate-filters"><input id="gq" placeholder="Buscar" value="'+esc(state.gateFilters.q)+'"><select id="gcat"><option value="">Categoria</option>'+gateOptions('category')+'</select><select id="gpillar"><option value="">Pilar</option>'+gateOptions('pillar')+'</select><select id="gowner"><option value="">Owner</option>'+gateOptions('owner')+'</select><select id="gstr"><option value="">Status estratégia</option>'+gateOptions('strategy_status')+'</select><select id="gneg"><option value="">Status negociação</option>'+gateOptions('negotiation_status')+'</select></div></div><div class="table-head"><div><h2>Calendário de gates</h2><p class="muted">'+rows.length+' processos filtrados.'+(state.gateQuick?' Filtro rápido ativo pelos cards.':'')+' Use apresentação para reunião e detalhado para análise completa.</p></div><div class="actions"><button id="gateClear" class="'+(state.gateQuick?'':'hidden')+'">Limpar cards</button><button id="gateMode">'+(present?'Ver tabela detalhada':'Ver apresentação')+'</button><button id="gateFull">Tela inteira</button><button id="importGates" class="'+(state.admin?'':'hidden')+'">Carregar tabela</button><input id="gateFile" class="hidden" type="file" accept=".xlsx,.xls,.csv,.tsv,text/csv,text/tab-separated-values"></div></div>'+table('gates',cols,rows,present?'present':'');function paintReco(){var r=recos[Number(gateReco.value)||0];gateRecoBox.innerHTML='<strong>'+r[0]+'</strong><ul>'+r[1].map(x=>'<li>'+x+'</li>').join('')+'</ul>'}gateReco.onchange=paintReco;paintReco();var map={gq:'q',gcat:'category',gpillar:'pillar',gowner:'owner',gstr:'strategy',gneg:'negotiation'};Object.keys(map).forEach(id=>{var el=document.getElementById(id);el.value=state.gateFilters[map[id]]||'';el.oninput=el.onchange=e=>{state.gateFilters[map[id]]=e.target.value;gates()}});gateClear.onclick=()=>{state.gateQuick='';render()};gateMode.onclick=()=>{state.gateView=present?'detail':'present';gates()};gateFull.onclick=()=>toggleFullscreen('gatesTableWrap',gateFull);if(importGates)importGates.onclick=()=>gateFile.click();if(gateFile)gateFile.onchange=importGateEvents}
function closeFullscreen(){document.querySelectorAll('.is-fullscreen').forEach(w=>{w.classList.remove('is-fullscreen');var b=w.querySelector('.fs-close');if(b)b.remove()});document.body.classList.remove('table-fullscreen');document.querySelectorAll('#critFull,#gateFull').forEach(b=>{if(b)b.textContent='Tela inteira'})}function toggleFullscreen(id,btn){var w=document.getElementById(id),on=!w.classList.contains('is-fullscreen');closeFullscreen();if(on){w.classList.add('is-fullscreen');document.body.classList.add('table-fullscreen');btn.textContent='Sair da tela inteira';var c=document.createElement('button');c.className='fs-close';c.textContent='Fechar tela inteira';c.onclick=closeFullscreen;w.appendChild(c)}}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeFullscreen()});function table(key,cols,rows,extraClass){var sort=state.sort[key]||{};var data=[...rows];if(sort.k)data.sort((a,b)=>cmp(a[sort.k],b[sort.k])*(sort.d==='desc'?-1:1));var wrap='table-wrap '+(key==='crit'?'critical-table':'');return '<div class="'+wrap+'" id="'+key+'TableWrap"><table class="'+key+'-table '+(extraClass||'')+'"><thead><tr>'+cols.map(c=>'<th data-table="'+key+'" data-key="'+c[1]+'">'+c[0]+'</th>').join('')+'</tr></thead><tbody>'+data.map(r=>'<tr data-id="'+esc(r.id)+'">'+cols.map(c=>'<td>'+editCell(r,c[1],r[c[1]])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}function gateStatusBadge(v){var text=String(v||'N/A'),s=text.toLowerCase(),cls=s.includes('realiz')?'b-green':(s.includes('n/a')||s==='na'||s.includes('não se aplica'))?'b-gray':s.includes('pend')?'b-yellow':'b-blue';return '<span class="badge '+cls+'">'+esc(text)+'</span>'}function dateBR(v){var s=String(v||'');var m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[3]+'-'+m[2]+'-'+m[1]:s}function fmt(k,v){if(['spend_category','spend_involved','annual_spend','global_value','spend'].includes(k))return esc(money(v));if(k==='planned_days')return esc(v?String(v)+' dias':'0 dias');if(['share_percent'].includes(k))return esc(pct(v));if(['expiration','strategy_gate','negotiation_gate','planned_capture_date','estimated_capture_date','updated_at','created_at','final_deadline'].includes(k))return esc(dateBR(v));if(['strategy_status','negotiation_status'].includes(k))return gateStatusBadge(v);if(['status_summary','process_status','deadline_status'].includes(k))return statusBadge(v);return esc(v)}function cmp(a,b){function n(v){var t=String(v||'').replace(/R\$|MM|%/gi,'').replace(/\./g,'').replace(',','.').trim(),x=parseFloat(t);return isNaN(x)?null:x}function d(v){var t=String(v||'');if(/^\d{4}-\d{2}-\d{2}/.test(t))return new Date(t).getTime();var m=t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);return m?new Date(+m[3],+m[2]-1,+m[1]).getTime():null}var da=d(a),db=d(b);if(da!=null&&db!=null)return da-db;var na=n(a),nb=n(b);if(na!=null&&nb!=null)return na-nb;return String(a||'').localeCompare(String(b||''),'pt-BR')}document.addEventListener('click',e=>{var card=e.target.closest&&e.target.closest('[data-gate-filter]');if(card){state.gateQuick=card.dataset.gateFilter==='all'?'':card.dataset.gateFilter;render();return}if(e.target.tagName==='TH'){var t=e.target.dataset.table,k=e.target.dataset.key,stateSort=state.sort[t]||{};state.sort[t]={k:k,d:stateSort.k===k&&stateSort.d==='asc'?'desc':'asc'};({crit:criticos,src:sourcing,gates:gates,vac:feriasPage})[t]();}});
function authError(d,status){var m=String((d&&d.error_description)||(d&&d.msg)||(d&&d.message)||'').toLowerCase();if(status===400&&m.includes('invalid login'))return 'E-mail ou senha incorretos. Se ainda não definiu senha, use o botão de link abaixo.';if(m.includes('email not confirmed'))return 'E-mail ainda não confirmado no Supabase Auth. Confirme o usuário no painel ou pelo convite recebido.';if(m.includes('user not found')||m.includes('not found'))return 'Usuário ainda não existe em Authentication > Users. Crie ou envie convite pelo Supabase.';if(m.includes('abort')||m.includes('timeout'))return 'A autenticação demorou demais para responder. Recarregue o site e tente novamente pelo link público.';return 'Não foi possível autenticar. Confira se o usuário existe, está confirmado e se a senha está correta.'}function authFetch(url,opt){opt=opt||{};var c=new AbortController(),t=setTimeout(()=>c.abort(),15000);opt.signal=c.signal;return fetch(url,opt).finally(()=>clearTimeout(t))}async function login(){var mail=email.value.trim().toLowerCase();if(adminEmails.indexOf(mail)<0){authMsg.textContent='Este e-mail não está liberado como admin neste cockpit.';return}if(state.recovery)return updatePassword();try{authMsg.textContent='Validando acesso admin...';var r=await authFetch(SUPA+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({email:mail,password:password.value})}),d=await r.json();if(!r.ok)throw {data:d,status:r.status};token=d.access_token;localStorage.setItem('csc_token',token);localStorage.setItem('csc_email',mail);if(rememberPass.checked){localStorage.setItem('csc_remember','1');localStorage.setItem('csc_password',password.value)}else{localStorage.removeItem('csc_remember');localStorage.removeItem('csc_password')}state.admin=true;authMsg.textContent='Você está logado.';render()}catch(e){authMsg.textContent=authError(e.data,e.status)}}async function sendReset(){var mail=email.value.trim().toLowerCase();if(adminEmails.indexOf(mail)<0){authMsg.textContent='Informe um e-mail admin liberado para este cockpit.';return}try{resetBtn.textContent='Enviando...';var r=await authFetch(SUPA+'/auth/v1/recover?redirect_to='+encodeURIComponent('https://diaswagnerjr.github.io/CockpitServ.Corp/'),{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({email:mail})}),d=await r.json().catch(()=>({}));if(!r.ok)throw {data:d,status:r.status};authMsg.textContent='Se o usuário existir no Supabase Auth, o link para definir senha será enviado para este e-mail.'}catch(e){authMsg.textContent=authError(e.data,e.status)}finally{resetBtn.textContent='Enviar link para definir senha'}}async function updatePassword(){if(!token){authMsg.textContent='Link de recuperação inválido ou expirado. Solicite um novo link.';return}if(!password.value||password.value.length<8){authMsg.textContent='Digite uma nova senha com pelo menos 8 caracteres.';return}try{loginBtn.textContent='Salvando...';var r=await authFetch(SUPA+'/auth/v1/user',{method:'PUT',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({password:password.value})}),d=await r.json().catch(()=>({}));if(!r.ok)throw {data:d,status:r.status};state.recovery=false;state.admin=true;localStorage.setItem('csc_token',token);history.replaceState(null,'',location.pathname+location.search);authMsg.textContent='Senha definida. Você está logado.';render()}catch(e){authMsg.textContent='Não consegui salvar a senha. O link pode ter expirado; envie um novo link.'}finally{loginBtn.textContent='Entrar para editar'}}function readAuthReturn(){var p=new URLSearchParams(location.hash.replace(/^#/,''));if(p.get('access_token')){token=p.get('access_token');localStorage.setItem('csc_token',token);state.recovery=p.get('type')==='recovery';password.value='';authMsg.textContent=state.recovery?'Digite uma nova senha e clique em Salvar nova senha.':'Sessão recebida do Supabase.'}}function logout(){token='';localStorage.removeItem('csc_token');state.admin=false;state.recovery=false;authMsg.textContent='Entre para editar.';render()}loginBtn.onclick=login;resetBtn.onclick=sendReset;logoutBtn.onclick=logout;theme.onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('csc_theme',document.body.classList.contains('dark')?'dark':'light');theme.textContent=document.body.classList.contains('dark')?'Tela clara':'Tela escura'};if(localStorage.getItem('csc_theme')==='dark'){document.body.classList.add('dark');theme.textContent='Tela clara'}if(localStorage.getItem('csc_remember')==='1'){rememberPass.checked=true;email.value=localStorage.getItem('csc_email')||'';password.value=localStorage.getItem('csc_password')||''}else{email.value=localStorage.getItem('csc_email')||email.value}if(token&&localStorage.getItem('csc_email')&&jwtOk(token))state.admin=true;else if(token&&!jwtOk(token)){token='';localStorage.removeItem('csc_token')}readAuthReturn();load();})();
