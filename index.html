<style>
:root{--bg:#eef2f6;--panel:#fff;--panel2:#f7fafc;--text:#172033;--muted:#61708a;--line:#d9e1ec;--brand:#123c69;--accent:#0f6b7a;--ok:#ecfdf5;--warn:#fff7ed;--bad:#fff1f2;--shadow:0 10px 35px rgba(23,32,51,.08)}body.dark{--bg:#0f1720;--panel:#16202c;--panel2:#1d2a38;--text:#e7eef8;--muted:#9fb0c3;--line:#334155;--brand:#6ea8fe;--accent:#67e8f9;--ok:#12352d;--warn:#3d2b16;--bad:#3d1821;--shadow:none}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,system-ui,sans-serif;color:var(--text);background:var(--bg)}button,input,select{font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);min-height:38px;padding:0 12px}button{cursor:pointer;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px}.primary,.active{background:var(--brand);color:#fff;border-color:var(--brand)}.shell{display:grid;grid-template-columns:285px minmax(0,1fr);min-height:100vh}.side{background:var(--panel);border-right:1px solid var(--line);padding:22px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:12px;align-items:center}.mark{width:44px;height:44px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:900}.brand strong,.brand small{display:block}.muted,.brand small{color:var(--muted)}nav{display:grid;gap:8px}nav button{justify-content:flex-start}.auth{margin-top:auto;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:10px}input{width:100%;padding:10px 12px}main{padding:28px;min-width:0}.top,.head,.banner{display:flex;align-items:center;justify-content:space-between;gap:16px}.eyebrow{margin:0 0 4px;color:var(--accent);text-transform:uppercase;font-size:.74rem;font-weight:900}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(1.7rem,3vw,2.4rem);margin-bottom:0}.tag{font-size:.73rem;font-weight:900;color:var(--accent)}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:20px 0}.metric,.card,.chart,.table-wrap,.tool,.file,.lane,.routine{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}.metric{padding:18px}.metric span{color:var(--muted);font-size:.8rem;font-weight:800}.metric strong{display:block;margin-top:8px;font-size:1.45rem}.stack{display:grid;gap:18px}.banner{padding:22px;border-radius:8px;background:var(--brand);color:#fff}.banner.light{background:var(--panel);color:var(--text);border:1px solid var(--line)}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card,.tool,.file,.lane,.routine{padding:18px}.col{padding:12px;border-radius:8px;background:var(--panel2);margin-top:10px}.warn{background:var(--warn)}.ok{background:var(--ok)}.bad{background:var(--bad)}.col ul{margin:8px 0 0;padding-left:18px}.col li{margin:6px 0}.flow{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.step{padding:12px;background:var(--panel2);border:1px solid var(--line);border-radius:8px}.step strong{display:block;color:var(--brand)}.routine-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.routine h3{margin-bottom:8px}.legal{padding:20px;border-radius:8px;background:var(--bad);border:1px solid #fecdd3;color:#be123c}.legal strong{font-size:1.35rem}.check{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;border-top:1px solid var(--line);padding:12px 0}.info{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;background:var(--panel2);border:1px solid var(--line);font-size:.78rem;font-weight:900;color:var(--accent);margin-left:6px}.chart{padding:14px;min-height:330px}.matrix{height:310px;background:linear-gradient(90deg,var(--ok),var(--warn),var(--bad));border:1px solid var(--line);border-radius:8px;position:relative}.axis{font-size:.72rem;color:var(--muted)}.dot{position:absolute;width:15px;height:15px;border-radius:50%;background:#0f766e;transform:translate(-50%,50%);box-shadow:0 0 0 4px var(--panel)}.dot.hot{background:#dc2626}.dot span{position:absolute;left:18px;top:-7px;white-space:nowrap;font-size:.75rem;font-weight:800;background:var(--panel);padding:2px 5px;border-radius:6px}.bars{height:280px;display:flex;align-items:end;gap:8px;border-bottom:1px solid var(--line);padding-top:24px}.bar{flex:1;background:#2563eb;border-radius:4px 4px 0 0;min-height:2px;position:relative}.bar span{position:absolute;bottom:-24px;left:50%;transform:translateX(-50%);font-size:.75rem}.bar strong{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:.7rem;white-space:nowrap}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:860px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:.74rem;text-transform:uppercase;color:var(--muted);background:var(--panel2)}.hidden{display:none}.actions{display:flex;gap:10px;flex-wrap:wrap}.risk{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.risk .card{box-shadow:none}.drive{color:inherit;font-weight:900}@media(max-width:980px){.shell{grid-template-columns:1fr}.side{position:static;height:auto}.metrics,.grid2,.grid3,.routine-grid,.risk,.flow{grid-template-columns:1fr}main,.side{padding:16px}.top,.head,.banner{align-items:stretch;flex-direction:column}}
</style>

<div class="shell"><aside class="side"><div class="brand"><span class="mark">SC</span><div><strong>Cockpit Serv. Corp</strong><small>Suzano | Serviços Corporativos</small></div></div><button id="theme">Tela escura</button><nav id="nav"></nav><section class="auth"><strong id="authTitle">Visualização pública</strong><input id="email" placeholder="e-mail admin"><input id="password" type="password" placeholder="senha"><button id="loginBtn" class="primary">Entrar para editar</button><button class="hidden" id="logoutBtn">Sair</button><small id="authMsg" class="muted"></small></section></aside><main><header class="top"><div><p class="eyebrow">Cockpit de Serviços Corporativos</p><h1 id="title"></h1></div><span class="tag">Público para visualização</span></header><section class="metrics" id="metrics"></section><section id="view" class="stack"></section></main></div>
<script>
(function(){
var SUPA='https://reebavnvftfibyhhjxat.supabase.co', KEY='sb_publishable_WksWBZLsVc1f4JBmQiRK5A_6swUYr-Z', token=localStorage.getItem('csc_token')||'', adminEmails=['wagnerdj@suzano.com.br'];
var state={tab:'processos',admin:false,crit:[],src:[],gates:[],files:[]};
var tabs={processos:'Processos & Rotinas',toolkit:'Tool Kit e Radar',criticos:'Processos críticos',sourcing:'Visão sourcing',gates:'Calendário de gates'};
var sharepoint='https://suzano.sharepoint.com/sites/SupriADMDigitalTech/Documentos%20Compartilhados/Forms/AllItems.aspx?TeamsCID=8995a6d8%2Dfb49%2D45e5%2D867a%2Dd062dd9f0096';
var processBlocks=[['Gestão da Demanda e Pipeline',['Gestão estruturada da demanda a partir do Plano Base, calendário de categorias e demandas das áreas clientes.','Pipeline único, com visibilidade de requisições, contratos a vencer, temas estruturantes e demandas não planejadas.'],['Ausência de Sourcing Plan integrado.','Oportunidade de, sempre que possível, antecipar o planejamento das demandas.','Oportunidade de maior uso do Farol de Contratos e de KPIs alinhados com a célula de gestão.'],['Rotina de leitura do Sourcing Monitor para enxergar processos futuros e riscos de capacidade.','Célula de gestão cruzando Sourcing Monitor, Farol de Contratos, saldo/vigência e status de requisição.','Agenda quadrimestral com áreas clientes para antecipar temas estruturantes e alimentar o cockpit.']],['Governança e Priorização',['Entendimento da demanda, classificação de criticidade, definição do fórum adequado, stage gates e formalização.'],['Critérios de criticidade pouco explícitos.','Escalonamento tardio de iniciativas estratégicas, complexas ou de alto valor.'],['Processos de R$5MM a R$15MM por valor global devem ser deliberados por e-mail, com racional documentado.','Processos acima de R$15MM devem passar por gate com o GE da área.','Gate de Estratégia acontece antes da RFQ: alinha demanda, categoria, escopo, especificações, mercado, vendor list, estratégia inicial e premissas comerciais antes de ir ao mercado.','Gate de Negociação/Fechamento valida recomendação, estratégia de negociação, últimos ajustes, plano de implementação e subida de alçadas.','Processos acima de R$15MM devem ter ficha-resumo preparada para sequenciamento de assinatura no CLM, conforme modelo do toolkit.','Todos os arquivos do processo devem ficar no drive da área: <a class="drive" target="_blank" href="'+sharepoint+'">abrir repositório oficial</a>.']],['Gestão de Categorias e Ciclo Básico do Contrato',['Agenda contínua com clientes internos, leitura de categoria e gestão do ciclo de vida contratual.','Gestão de saldo, vigência, aditivos, pré-renovação e retroalimentação do pipeline.'],['Base contratual, saldo e alarmística ainda podem ser mais integrados à gestão semanal.','Renovações, rebids e encerramentos precisam ser antecipados com maior previsibilidade.'],['Célula de gestão sustenta cadastro, qualidade da base, controle de saldo/vigência, alarmes e encaminhamento para aditivar, rebidar, renovar ou encerrar.','GCATs e célula atuam juntos para reduzir ruptura, organizar handover e padronizar templates, SLAs e controles.']],['Gestão, Indicadores e Liderança',['Liderança direciona o time por indicadores, inteligência de mercado, criticidade, riscos e governança.'],['Oportunidade de ajustar agendas para que processos, riscos e decisões apareçam no dia a dia, e não apenas no fechamento do mês.'],['Gestão à vista dos gates, sourcing, críticos, indicadores, pendências da célula de gestão e plano de ação.','Ritos semanais, mensais e trimestrais conectados a decisões, priorização e desenvolvimento do time.']]];
var cellSteps=['Cadastro e classificação da base contratual por criticidade, risco e contingência.','Controle de saldo total, consumido, reservado, disponível e prazo restante.','Previsão de consumo, ruptura e sobre/subutilização.','Acompanhamento de prazo contratual.','Alarmística e escalonamento de vencimentos e saldos.','Tratativa definida: aditivar, rebidar, renovar ou encerrar.'];
var cellRoles=['Criar AFs, aditivos, reajustes e encerramentos no ERP com templates padronizados e workflow via Planner.','Manter base de contratos, pedidos e SoulPlan saneada e atualizada.','Monitorar consumo, saldo disponível, vencimentos e pré-renovações.','Operar farol de vencimentos/saldos com escalations de 180/90/60 dias.','Conduzir ritos semanais com GCATs para pendências, prioridades, urgências e plano de ação.','Acompanhar RCs, FRS, KPIs, riscos, governança, matriz RACI, handover contratual e melhoria contínua.'];
var routines=[['Semanal','1:1s para direcionamento, destravamento de processos e touch de gestão. Reunião semanal para recados, gates, pontos críticos, agenda da semana, plano de ação e follow-up da célula de gestão.'],['Mensal','Agendas de performance com Ns de Suprimentos e áreas de Facilities/Tech. Touch com guardiões de Sourcing Monitor, PB/RF & Metas, Matricial e CLM.'],['Trimestral','Agenda estruturante e follow-up de projetos, overview de metas, direcionamentos gerais, engajamento, carreira, feedback, PDI e trocas.']];
var toolkit=[['Approach de Base','Resumo executivo do escopo','Categoria, descrição, valor PB, baseline/real, vigência, prazo de pagamento, subcontratação, paramétrica, cláusula de saída, take or pay, SLAs e pontos jurídicos.','Consolida os fatos mínimos para qualquer liderança entender tamanho, prazo, risco e decisão necessária.'],['Approach de Base','Resumo da categoria','Spend total, share por unidade de negócio, fornecedor e unidade; fatia endereçada e destino esperado.','Mostra relevância da categoria e o quanto do spend está efetivamente em negociação.'],['Approach de Base','Entendimento do escopo','Local, serviços pedidos, quantitativos, cenário atual de fornecimento e premissas operacionais.','Evita comparar propostas desalinhadas e ajuda a separar efeito preço de efeito volume/demanda.'],['Approach do Processo','Mercado e vendor list','Dinâmica de mercado, oferta, representatividade Suzano, barganha, drivers, vendor list e cenário oferta/demanda.','Base para definir concorrência, BATNA, riscos de fornecedor e estratégia de negociação.'],['Approach do Processo','Parecer técnico, Linkana e performance','Resumo técnico, avaliação de fornecedores, compliance, saúde cadastral e SLAs/performance atuais quando houver.','Garante que a recomendação comercial esteja suportada por capacidade técnica, risco e histórico.'],['Approach do Processo','Cost breakdown, MCC e cenários','Escopo, preços unitários/totais, MCC, Plano Base, Real, should cost e cenários equalizados.','Permite comparar fornecedores em base equivalente e isolar variações de preço, volume e escopo.'],['Approach do Processo','Alavancas e recomendação','Alavancas exploradas, recomendação comercial, mapa final do processo e próximos passos de implementação.','Transforma análise em decisão: o que foi tentado, o que funcionou e qual caminho recomendar.'],['Approach para Ativos','Ativos, rental/buy e paramétrica','Composição do ativo no CBD, comparação rental/buy, remuneração do ativo no contrato e cuidado para não remunerar duas vezes via paramétrica.','Necessário quando a proposta contém CAPEX/ativo embutido, frota, equipamentos, mobilização ou remuneração financeira relevante.']];
var fallback={crit:[],src:[],gates:[],files:[]};
async function api(table,opt){opt=opt||{};var method=opt.method||'GET',url=SUPA+'/rest/v1/'+table+(method==='GET'?'?select=*&order=created_at.asc':'');var h={apikey:KEY,Authorization:'Bearer '+(token||KEY),'Content-Type':'application/json',Prefer:'return=representation'};var r=await fetch(url,{method:method,headers:h,body:opt.body?JSON.stringify(opt.body):undefined});if(!r.ok)throw new Error(await r.text());return method==='DELETE'?[]:r.json()}
async function load(){try{var r=await Promise.all([api('csc_critical_processes'),api('csc_sourcing_processes'),api('csc_gate_events'),api('csc_inspiration_files')]);state.crit=r[0];state.src=r[1];state.gates=r[2];state.files=r[3]}catch(e){console.warn(e);state.crit=fallback.crit;state.src=fallback.src;state.gates=fallback.gates;state.files=fallback.files}render()}
function render(){authTitle.textContent=state.admin?'Admin autenticado':'Visualização pública';logoutBtn.classList.toggle('hidden',!state.admin);nav.innerHTML=Object.keys(tabs).map(k=>'<button class="'+(state.tab===k?'active':'')+'" data-tab="'+k+'">'+tabs[k]+'</button>').join('');document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});title.textContent=tabs[state.tab];metrics.innerHTML=metric('Críticos abertos',state.crit.filter(x=>x.status!=='Concluído').length)+metric('Spend sourcing >5MM','R$'+sum(state.src,'spend').toFixed(1)+'MM')+metric('Processos >5MM',state.src.length)+metric('Gates pendentes',state.gates.filter(x=>x.negotiation_status==='Pendente'||x.strategy_status==='Pendente').length);({processos,toolkit:toolkitPage,criticos,sourcing,gates})[state.tab]()}
function metric(a,b){return '<article class="metric"><span>'+a+'</span><strong>'+b+'</strong></article>'}function sum(a,k){return a.reduce((s,x)=>s+Number(x[k]||0),0)}function esc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function col(t,a,c){return '<div class="col '+(c||'')+'"><strong>'+t+'</strong><ul>'+a.map(x=>'<li>'+x+'</li>').join('')+'</ul></div>'}
function processos(){view.innerHTML='<div class="banner"><div><p class="eyebrow">Modelo operacional</p><h2>Rotina integrada para antecipar demandas, priorizar decisões e proteger o ciclo contratual.</h2></div><button id="goGate">Ver calendário de gates</button></div><div class="grid2">'+processBlocks.map(b=>'<article class="card"><h3>'+b[0]+'</h3>'+col('Processo esperado',b[1])+col('Gaps / oportunidades',b[2],'warn')+col('To be proposto',b[3],'ok')+'</article>').join('')+'</div><section class="card"><p class="eyebrow">Célula de Gestão</p><h2>Como a célula opera o ciclo de vida dos contratos</h2><div class="flow">'+cellSteps.map((x,i)=>'<div class="step"><strong>B'+i+'</strong><span>'+x+'</span></div>').join('')+'</div><div class="grid2" style="margin-top:14px">'+cellRoles.map(x=>'<div class="col">'+x+'</div>').join('')+'</div></section><section><div class="head"><div><p class="eyebrow">Rotinas</p><h2>Dinâmica das reuniões</h2></div></div><div class="routine-grid">'+routines.map(r=>'<article class="routine"><h3>'+r[0]+'</h3><p class="muted">'+r[1]+'</p></article>').join('')+'</div></section>';goGate.onclick=()=>{state.tab='gates';render()}}
function toolkitPage(){view.innerHTML='<div class="legal"><strong>Minuta jurídica é elemento do processo.</strong><span>Comece na Etapa de Base. Deixar para o final atrasa CLM e aumenta risco de fornecimento.</span></div><div class="banner light"><div><p class="eyebrow">Toolkit consultivo</p><h2>Checklist não exaustivo, organizado por approach. O time pode retirar itens não pertinentes, desde que registre o racional.</h2></div><button id="down">Exportar checklist</button></div><div class="grid3">'+['Approach de Base','Approach do Processo','Approach para Ativos'].map(g=>'<section class="tool"><h3>'+g+'</h3>'+toolkit.filter(x=>x[0]===g).map(x=>'<div class="check"><div><strong>'+x[1]+' <span class="info" title="'+esc(x[3])+'">i</span></strong><p class="muted">'+x[2]+'</p></div><span class="tag">check</span></div>').join('')+'</section>').join('')+'</div><section><div class="head"><h2>Materiais de inspiração</h2>'+(state.admin?'<button id="addFile">Adicionar link</button>':'')+'</div><div class="grid3">'+state.files.map(f=>'<article class="file"><span class="tag">'+esc(f.file_type)+'</span><h3>'+esc(f.title)+'</h3><p class="muted">'+esc(f.description)+'</p>'+(f.file_url?'<a href="'+esc(f.file_url)+'" target="_blank">Abrir referência</a>':'')+'</article>').join('')+'</div></section>';down.onclick=downloadChecklist;var a=document.getElementById('addFile');if(a)a.onclick=addFile}
function downloadChecklist(){var rows=[['Cluster','Item','Descrição','Como usar']].concat(toolkit.map(x=>[x[0],x[1],x[2],x[3]]));var csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='checklist-toolkit-servicos-corporativos.csv';a.click()}
async function addFile(){var title=prompt('Nome do material');if(!title)return;await api('csc_inspiration_files',{method:'POST',body:{id:crypto.randomUUID(),title:title,description:'Material carregado pelo admin.',file_url:prompt('Link do arquivo')||'',file_type:'Link'}});load()}
function criticos(){var open=state.crit.filter(x=>x.status!=='Concluído');view.innerHTML='<div class="risk"><article class="card"><h3>Ruído crítico</h3><p class="muted">Produção, ESG, compliance, auditoria, imagem ou ruptura regulatória.</p></article><article class="card"><h3>Ruído operacional</h3><p class="muted">Satisfação do cliente interno, clima, continuidade, qualidade e performance operacional.</p></article><article class="card"><h3>Ruído financeiro</h3><p class="muted">Impacto econômico, perda de captura, pleitos, atrasos ou desalinhamento com a estratégia corporativa.</p></article></div><div class="head"><div><h2>Matriz criticidade x urgência</h2><p class="muted">Quanto menos processos críticos abertos, melhor. Eixo X: criticidade/classificação. Eixo Y: urgência/prazo.</p></div>'+(state.admin?'<button id="addCrit">Novo crítico</button>':'')+'</div><div class="chart"><div class="matrix">'+open.map(x=>'<div class="dot '+(Number(x.criticality)+Number(x.urgency)>=8?'hot':'')+'" style="left:'+Number(x.criticality)*20+'%;bottom:'+Number(x.urgency)*20+'%"><span>'+esc(x.name)+'</span></div>').join('')+'</div></div>'+table(['Processo','Responsável','Spend','Riscos','C/U','Status','Plano/Comentário'],state.crit.map(x=>[x.name,x.owner,x.spend,x.noise,Number(x.criticality)+'/'+Number(x.urgency),x.status,x.action_plan]));var a=document.getElementById('addCrit');if(a)a.onclick=async()=>{var name=prompt('Nome do processo crítico');if(!name)return;await api('csc_critical_processes',{method:'POST',body:{id:crypto.randomUUID(),name:name,cluster:'',month:'novo',category:name,spend:'N/A',criticality:3,urgency:3,status:'Aberto'}});load()}}
function sourcing(){var year=Number(document.getElementById('year')?document.getElementById('year').value:2026), rows=state.src.filter(x=>Number(x.year)===year), months=['Apr','May','Jun','Jul','Aug','Sep','Out–Nov/26','Dec'], max=Math.max(1,...rows.map(x=>Number(x.spend||0)));view.innerHTML='<div class="head"><div><h2>Sourcing Plan &gt;5MM '+year+'</h2><p class="muted">Visão carregada da guia Sourcing Plan &gt;5MM.</p></div><div class="actions"><select id="year"><option '+(year===2026?'selected':'')+'>2026</option></select></div></div><div class="chart"><div class="bars">'+months.map(m=>{var v=sum(rows.filter(x=>x.month===m),'spend');return '<div class="bar" style="height:'+Math.max(2,v/max*240)+'px"><strong>'+(v?'R$'+v.toFixed(1)+'MM':'')+'</strong><span>'+m+'</span></div>'}).join('')+'</div></div>'+table(['Captura','Iniciativa','Tipo','Unidades','Spend','Owner','Gate atual/status','Descrição'],rows.map(x=>[x.month,x.initiative,x.category,x.pillar,'R$'+Number(x.spend).toFixed(1)+'MM',x.owner,x.gate_status||x.status,x.scope]));year.onchange=sourcing}
function gates(){view.innerHTML='<div class="head"><div><h2>Agenda com GE</h2><p class="muted">R$5MM a R$15MM por e-mail; acima de R$15MM em gates.</p></div></div>'+table(['Iniciativa','Categoria','Cliente','Owner','Valor global','Gate estratégia','Gate negociação','Status'],state.gates.map(x=>[x.initiative,x.category,x.client,x.owner,x.global_value?'R$'+Number(x.global_value).toFixed(1)+'MM':'N/A',x.strategy_gate||'N/A',x.negotiation_gate||'N/A',x.negotiation_status]))}
function table(h,rows){return '<div class="table-wrap"><table><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
async function login(){var mail=email.value.trim().toLowerCase();if(adminEmails.indexOf(mail)<0){authMsg.textContent='Use o e-mail admin liberado: wagnerdj@suzano.com.br';return}try{var r=await fetch(SUPA+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:mail,password:password.value})}),d=await r.json();if(!r.ok)throw Error();token=d.access_token;localStorage.setItem('csc_token',token);state.admin=true;authMsg.textContent='Admin autenticado.';render()}catch(e){authMsg.textContent='Confirme usuário/senha no Supabase Auth.'}}
function logout(){token='';localStorage.removeItem('csc_token');state.admin=false;authMsg.textContent='';render()}
loginBtn.onclick=login;logoutBtn.onclick=logout;theme.onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('csc_theme',document.body.classList.contains('dark')?'dark':'light');theme.textContent=document.body.classList.contains('dark')?'Tela clara':'Tela escura'};if(localStorage.getItem('csc_theme')==='dark'){document.body.classList.add('dark');theme.textContent='Tela clara'}load();
})();
</script>
</body></html>
