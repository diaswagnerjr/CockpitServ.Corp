<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cockpit Serviços Corporativos</title>
<style>
:root{font-family:Inter,Segoe UI,system-ui,sans-serif;color:#172033;background:#eef2f6}*{box-sizing:border-box}body{margin:0}.shell{display:grid;grid-template-columns:280px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid #d9e1ec;padding:22px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:12px;align-items:center}.mark{width:44px;height:44px;border-radius:8px;background:#123c69;color:#fff;display:grid;place-items:center;font-weight:900}.brand small,.muted{color:#637089}.brand strong,.brand small{display:block}nav{display:grid;gap:8px}button,input,select{font:inherit;border:1px solid #d5dce8;border-radius:8px;background:#fff;color:#172033;min-height:38px;padding:0 12px}button{cursor:pointer;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px}.primary,.active{background:#123c69;color:#fff;border-color:#123c69}input{width:100%;padding:10px 12px}.auth{margin-top:auto;background:#f5f8fb;border:1px solid #d9e1ec;border-radius:8px;padding:14px;display:grid;gap:10px}main{padding:28px;min-width:0}.top,.section-head,.banner{display:flex;justify-content:space-between;align-items:center;gap:16px}.eyebrow{margin:0 0 4px;color:#0f6b7a;text-transform:uppercase;font-size:.75rem;font-weight:900}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(1.7rem,3vw,2.4rem);margin-bottom:0}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.metric,.card,.chart,.table-wrap,.tool,.file{background:#fff;border:1px solid #d9e1ec;border-radius:8px}.metric{padding:18px}.metric span{color:#637089;font-size:.8rem;font-weight:800}.metric strong{display:block;margin-top:8px;font-size:1.5rem}.stack{display:grid;gap:18px}.banner{padding:22px;border-radius:8px;background:#123c69;color:#fff}.banner.light{background:#fff;color:#172033;border:1px solid #d9e1ec}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card,.tool,.file{padding:18px}.col{padding:12px;border-radius:8px;background:#f5f8fb;margin-top:10px}.warn{background:#fff7ed}.ok{background:#ecfdf5}.col ul{margin:8px 0 0;padding-left:18px}.col li{margin:6px 0}.legal{padding:20px;border-radius:8px;background:#fff1f2;border:1px solid #fecdd3;color:#9f1239;display:grid;gap:6px}.legal strong{font-size:1.4rem}.check{display:grid;grid-template-columns:1fr auto;gap:10px;border-top:1px solid #eef2f6;padding:12px 0}.tag{font-size:.72rem;font-weight:900;color:#0f6b7a;white-space:nowrap}.chart{padding:14px;min-height:320px;position:relative}.matrix{height:300px;background:linear-gradient(90deg,#ecfdf5,#fff7ed,#fff1f2);border:1px solid #d9e1ec;border-radius:8px;position:relative}.dot{position:absolute;width:15px;height:15px;border-radius:50%;background:#0f766e;transform:translate(-50%,50%);box-shadow:0 0 0 4px #fff}.dot.hot{background:#dc2626}.dot span{position:absolute;left:18px;top:-7px;white-space:nowrap;font-size:.78rem;font-weight:800;background:#fff;padding:2px 5px;border-radius:6px}.bars{height:280px;display:flex;align-items:end;gap:8px;border-bottom:1px solid #cbd5e1;padding-top:20px}.bar{flex:1;background:#2563eb;border-radius:4px 4px 0 0;min-height:2px;position:relative}.bar span{position:absolute;bottom:-24px;left:50%;transform:translateX(-50%);font-size:.75rem}.bar strong{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:.7rem;white-space:nowrap}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:12px;border-bottom:1px solid #eef2f6;vertical-align:top}th{font-size:.75rem;text-transform:uppercase;color:#637089;background:#f8fafc}.hidden{display:none}.actions{display:flex;gap:10px;flex-wrap:wrap}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{position:static;height:auto}.metrics,.grid2,.grid3{grid-template-columns:1fr}main,.side{padding:16px}.top,.section-head,.banner{align-items:stretch;flex-direction:column}}
</style>
</head>
<body>
<div class="shell"><aside class="side"><div class="brand"><span class="mark">SC</span><div><strong>Cockpit Serv. Corp</strong><small>Suzano | Serviços Corporativos</small></div></div><nav id="nav"></nav><section class="auth"><strong id="authTitle">Visualização pública</strong><input id="email" placeholder="e-mail admin"><input id="password" type="password" placeholder="senha"><button class="primary" onclick="login()">Entrar para editar</button><button class="hidden" id="logout" onclick="logout()">Sair</button><small id="authMsg" class="muted"></small></section></aside><main><header class="top"><div><p class="eyebrow">Cockpit de gestão semanal</p><h1 id="title"></h1></div><span class="tag">Supabase conectado</span></header><section class="metrics" id="metrics"></section><section id="view" class="stack"></section></main></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const URL='https://reebavnvftfibyhhjxat.supabase.co';
const KEY='sb_publishable_WksWBZLsVc1f4JBmQiRK5A_6swUYr-Z';
const adminEmails=['wagnerdj@suzano.com.br'];
const sb=createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}});
let state={tab:'processos',admin:false,crit:[],src:[],gates:[],files:[]};
const tabs={processos:'Processos & Rotinas',toolkit:'Tool Kit e Radar',criticos:'Processos críticos',sourcing:'Visão sourcing',gates:'Calendário de gates'};
const processBlocks=[['Gestão da Demanda e Pipeline',['Gestão estruturada da demanda via Plano Base e Gestão de Categorias.','Incorporação de demandas não planejadas, priorização e execução.'],['Ausência de Sourcing Plan integrado além de Tech.','Atuação reativa com baixo planejamento antecipado.','Uso limitado de Sourcing Monitor, Farol de Contratos e KPIs.'],['Rotina Sourcing Monitor para enxergar processos à frente.','Célula de gestão cruza Sourcing Monitor, Farol de Contratos e status de requisição.','Agenda quadrimestral com áreas para temas estruturantes acompanhada no cockpit.']],['Governança e Priorização',['Entendimento da demanda, criticidade, stage gates, aprovações e formalização.'],['Critérios de criticidade pouco explícitos.','Escalonamento tardio de iniciativas estratégicas e de alto valor.'],['R$5MM a R$15MM por valor global: deliberação por e-mail.','Acima de R$15MM: gate com GE da área.','Gate de Estratégia azeita pré-sourcing: demanda, categoria, especificações, mercado, vendor list, estratégia inicial e RFQ.','Gate de Negociação/Fechamento aprova estratégia final, ajustes, planos e alçadas.']],['Gestão de Categorias e Ciclo Básico do Contrato',['Agenda contínua com clientes internos, rotinas e iniciativas estruturantes.','Gestão de saldo, vigência, aditivos, pré-renovação e retroalimentação do pipeline.'],['Base contratual e alarmística ainda dispersas.','Renovações e rebids precisam ser antecipados.'],['Célula de gestão monitora saldo total, consumido, reservado, disponível e prazo restante.','Encaminhamento para aditivar, rebidar, renovar ou encerrar.']],['Gestão, Indicadores e Liderança',['Liderança direciona a equipe por indicadores, inteligência de mercado e governança.'],['Indicadores ainda pouco integrados à decisão semanal.'],['Semanal: 1:1s, recados, gates, críticos e follow-up da célula de gestão.','Mensal: performance com Ns de Suprimentos e touch guardiões.','Trimestral: agenda estruturante, metas, feedback, PDI e carreira.']]];
const toolkit=[['Etapa 01','Resumo executivo do escopo','Categoria, descrição, valor PB, baseline/real, vigência, prazo de pagamento, subcontratação, paramétrica, cláusula de saída, take or pay, SLAs e pontos jurídicos.','Base'],['Etapa 01','Resumo short da categoria','Spend total, share por unidade de negócio, fornecedor e unidade; fatia endereçada e destino.','Base'],['Etapa 01','Entendimento do escopo','Local, serviços pedidos, quantitativos e cenário atual de fornecimento.','Base'],['Etapa 01','Mercado e vendor list','Dinâmica de mercado, oferta, representatividade Suzano, barganha, drivers, vendor pretendido e oferta/demanda.','Base'],['Etapa 01','Informações finais','Mobilização, desmobilização, alojamento, cronograma e alavancas comerciais.','Quando aplicável'],['Etapa 02','Parecer técnico e Linkana','Resumo técnico, avaliação de fornecedores, performance e SLAs atuais quando houver.','Base'],['Etapa 02','Cost breakdown e MCC','Escopo, preços unitários/totais, MCC, Plano Base, Real, should cost e cenários equalizados.','Base'],['Etapa 02','Alavancas e recomendação','Alavancas exploradas e mapa final para debate comercial.','Base'],['Ativos','CBD do ativo','Composição do ativo, rental/buy, remuneração no contrato e cuidado com paramétrica para não remunerar duas vezes.','Base']];
async function load(){const [crit,src,gates,files]=await Promise.all([q('csc_critical_processes'),q('csc_sourcing_processes'),q('csc_gate_events'),q('csc_inspiration_files')]);state={...state,crit,src,gates,files};const {data}=await sb.auth.getSession();const mail=data.session?.user?.email?.toLowerCase();state.admin=adminEmails.includes(mail);paintAuth();render()}async function q(t){const {data,error}=await sb.from(t).select('*').order('created_at',{ascending:true});if(error){console.warn(error);return[]}return data||[]}
function paintAuth(){authTitle.textContent=state.admin?'Admin autenticado':'Visualização pública';logout.classList.toggle('hidden',!state.admin)}
window.login=async()=>{const mail=email.value.trim().toLowerCase();if(!adminEmails.includes(mail)){authMsg.textContent='E-mail não liberado como admin.';return}const {error}=await sb.auth.signInWithPassword({email:mail,password:password.value});authMsg.textContent=error?'Confirme usuário/senha no Supabase Auth.':'Admin autenticado.';await load()};window.logout=async()=>{await sb.auth.signOut();state.admin=false;paintAuth();render()};
function render(){nav.innerHTML=Object.entries(tabs).map(([k,v])=>`<button class="${state.tab===k?'active':''}" onclick="go('${k}')">${v}</button>`).join('');title.textContent=tabs[state.tab];metrics.innerHTML=metric('Críticos abertos',state.crit.filter(x=>x.status!=='Concluído').length)+metric('Spend sourcing',`R$${sum(state.src,'spend').toFixed(1)}MM`)+metric('Processos ahead',state.src.length)+metric('Gates pendentes',state.gates.filter(x=>x.negotiation_status==='Pendente'||x.strategy_status==='Pendente').length);({processos,toolkit:toolkitPage,criticos,sourcing,gates})[state.tab]()}window.go=t=>{state.tab=t;render()};function metric(a,b){return`<article class="metric"><span>${a}</span><strong>${b}</strong></article>`}function sum(a,k){return a.reduce((s,x)=>s+Number(x[k]||0),0)}function esc(s=''){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function processos(){view.innerHTML=`<div class="banner"><div><p class="eyebrow">Modelo operacional</p><h2>Do reativo ao planejado, com pipeline, gates e ciclo contratual integrados.</h2></div><button onclick="go('gates')">Ver calendário de gates</button></div><div class="grid2">${processBlocks.map(b=>`<article class="card"><h3>${b[0]}</h3>${col('Processo esperado',b[1])}${col('Gaps atuais',b[2],'warn')}${col('To be proposto',b[3],'ok')}</article>`).join('')}</div>`}function col(t,arr,c=''){return`<div class="col ${c}"><strong>${t}</strong><ul>${arr.map(x=>`<li>${x}</li>`).join('')}</ul></div>`}
function toolkitPage(){view.innerHTML=`<div class="legal"><strong>Minuta jurídica é elemento do processo.</strong><span>Começar na Etapa 01. Deixar para o final atrasa CLM e aumenta risco de fornecimento.</span></div><div class="banner light"><div><p class="eyebrow">Radar não exaustivo</p><h2>O checklist orienta o debate; itens podem sair quando não forem pertinentes.</h2></div><button onclick="downloadChecklist()">Baixar checklist</button></div><div class="grid3">${['Etapa 01','Etapa 02','Ativos'].map(g=>`<section class="tool"><h3>${g}</h3>${toolkit.filter(x=>x[0]===g).map(x=>`<div class="check"><div><strong>${x[1]}</strong><p class="muted">${x[2]}</p></div><span class="tag">${x[3]}</span></div>`).join('')}</section>`).join('')}</div><section><div class="section-head"><h2>Materiais de inspiração</h2>${state.admin?'<button onclick="addFile()">Adicionar link</button>':''}</div><div class="grid3">${state.files.map(f=>`<article class="file"><span class="tag">${esc(f.file_type)}</span><h3>${esc(f.title)}</h3><p class="muted">${esc(f.description)}</p>${f.file_url?`<a href="${esc(f.file_url)}" target="_blank">Abrir referência</a>`:''}</article>`).join('')}</div></section>`}window.downloadChecklist=()=>{const csv='Etapa,Titulo,Obrigatorio,Descricao\n'+toolkit.map(x=>x.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='checklist-toolkit-servicos-corporativos.csv';a.click()};
function criticos(){const open=state.crit.filter(x=>x.status!=='Concluído');view.innerHTML=`<div class="section-head"><div><h2>Matriz criticidade x urgência</h2><p class="muted">Polaridade: quanto menos processos críticos abertos, melhor.</p></div>${state.admin?'<button onclick="addCrit()">Novo crítico</button>':''}</div><div class="chart"><div class="matrix">${open.map(x=>`<div class="dot ${Number(x.criticality)+Number(x.urgency)>=8?'hot':''}" style="left:${Number(x.criticality)*20}%;bottom:${Number(x.urgency)*20}%"><span>${esc(x.name)}</span></div>`).join('')}</div></div>${table(['Processo','Cluster','Spend','Gargalo executivo','C/U','Status','Ação'],state.crit.map(x=>[x.name,x.cluster,x.spend,x.executive_bottleneck,`${x.criticality}/${x.urgency}`,x.status,state.admin&&x.status!=='Concluído'?`<button onclick="closeCrit('${x.id}')">Concluir</button>`:x.action_plan]))}`}window.addCrit=async()=>{const name=prompt('Nome do processo crítico');if(!name)return;await sb.from('csc_critical_processes').insert({id:crypto.randomUUID(),name,cluster:'Facilities',month:'novo',category:'Categoria',spend:'R$0MM',criticality:3,urgency:3,status:'Aberto'});await load()};window.closeCrit=async id=>{await sb.from('csc_critical_processes').update({status:'Concluído',updated_at:new Date().toISOString().slice(0,10)}).eq('id',id);await load()};
function sourcing(){const year=Number(document.querySelector('#year')?.value||2026);const rows=state.src.filter(x=>Number(x.year)===year);const max=Math.max(1,...rows.map(x=>Number(x.spend)));view.innerHTML=`<div class="section-head"><div><h2>Pipeline ${year}</h2><p class="muted">Esteira integrada de demandas por mês, pilar e spend.</p></div><div class="actions"><select id="year" onchange="sourcing()"><option ${year===2026?'selected':''}>2026</option><option ${year===2027?'selected':''}>2027</option></select>${state.admin?'<button onclick="addSource()">Nova demanda</button>':''}</div></div><div class="chart"><div class="bars">${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].map(m=>{const v=sum(rows.filter(x=>x.month===m),'spend');return`<div class="bar" style="height:${Math.max(2,v/max*240)}px"><strong>${v?`R$${v.toFixed(1)}MM`:''}</strong><span>${m}</span></div>`}).join('')}</div></div>${table(['Mês','Iniciativa','Categoria','Escopo','Pilar','Spend','Status'],rows.map(x=>[x.month,x.initiative,x.category,x.scope,x.pillar,`R$${Number(x.spend).toFixed(1)}MM`,x.status]))}`}window.sourcing=sourcing;window.addSource=async()=>{const initiative=prompt('Nome da iniciativa');if(!initiative)return;await sb.from('csc_sourcing_processes').insert({id:crypto.randomUUID(),year:2026,month:'Jan',initiative,category:'Categoria',scope:'Escopo',pillar:'Facilities',spend:0,status:'Planejado'});await load()};
function gates(){view.innerHTML=`<div class="section-head"><div><h2>Agenda com GE</h2><p class="muted">R$5MM a R$15MM por e-mail; acima de R$15MM em gates.</p></div>${state.admin?'<button onclick="addGate()">Novo gate</button>':''}</div>${table(['Iniciativa','Categoria','Cliente','Owner','Valor global','Gate estratégia','Gate negociação','Status'],state.gates.map(x=>[x.initiative,x.category,x.client,x.owner,x.global_value?`R$${Number(x.global_value).toFixed(1)}MM`:'N/A',x.strategy_gate||'N/A',x.negotiation_gate||'N/A',x.negotiation_status]))}`}window.addGate=async()=>{const initiative=prompt('Nome da iniciativa para gate');if(!initiative)return;await sb.from('csc_gate_events').insert({id:crypto.randomUUID(),initiative,category:'Categoria',pillar:'Facilities',client:'Cliente',owner:'',strategy_status:'Pendente',negotiation_status:'Pendente'});await load()};
async function addFile(){const title=prompt('Nome do material');if(!title)return;const file_url=prompt('Link do arquivo')||'';await sb.from('csc_inspiration_files').insert({id:crypto.randomUUID(),title,description:'Material carregado pelo admin.',file_url,file_type:'Link'});await load()}window.addFile=addFile;
function table(h,rows){return`<div class="table-wrap"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
load();
</script>
</body>
</html>
