function boot(){state.crit=fallback.crit;state.src=fallback.src;state.gates=fallback.gates;state.files=fallback.files;state.admin=false;render();refresh();document.getElementById('loginBtn').onclick=login;document.getElementById('logoutBtn').onclick=logout}
async function api(table,opt){opt=opt||{};var method=opt.method||'GET';var url=SUPA+'/rest/v1/'+table+(method==='GET'?'?select=*&order=created_at.asc':'');var headers={apikey:KEY,Authorization:'Bearer '+(token||KEY),'Content-Type':'application/json',Prefer:'return=representation'};var res=await fetch(url,{method:method,headers:headers,body:opt.body?JSON.stringify(opt.body):undefined});if(!res.ok)throw new Error(await res.text());return method==='DELETE'?[]:res.json()}
async function refresh(){try{var r=await Promise.all([api('csc_critical_processes'),api('csc_sourcing_processes'),api('csc_gate_events'),api('csc_inspiration_files')]);state.crit=r[0];state.src=r[1];state.gates=r[2];state.files=r[3];state.online=true;document.getElementById('conn').textContent='Supabase conectado';render()}catch(e){state.online=false;document.getElementById('conn').textContent='Dados base';console.warn(e)}}
async function login(){var mail=document.getElementById('email').value.trim().toLowerCase();var pass=document.getElementById('password').value;if(adminEmails.indexOf(mail)<0){msg('Use o e-mail admin liberado: wagnerdj@suzano.com.br');return}try{var res=await fetch(SUPA+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:mail,password:pass})});var data=await res.json();if(!res.ok)throw new Error(data.error_description||data.msg||'Falha de login');token=data.access_token;localStorage.setItem('csc_token',token);state.admin=true;msg('Admin autenticado.');render()}catch(e){msg('Não consegui autenticar. Confirme usuário/senha no Supabase Auth.')}}
function logout(){token='';localStorage.removeItem('csc_token');state.admin=false;msg('');render()}function msg(t){document.getElementById('authMsg').textContent=t}
function render(){document.getElementById('authTitle').textContent=state.admin?'Admin autenticado':'Visualização pública';document.getElementById('logoutBtn').classList.toggle('hidden',!state.admin);document.getElementById('nav').innerHTML=Object.keys(tabs).map(function(k){return '<button class="'+(state.tab===k?'active':'')+'" data-tab="'+k+'">'+tabs[k]+'</button>'}).join('');Array.prototype.forEach.call(document.querySelectorAll('nav button'),function(b){b.onclick=function(){state.tab=b.getAttribute('data-tab');render()}});document.getElementById('title').textContent=tabs[state.tab];document.getElementById('metrics').innerHTML=metric('Críticos abertos',state.crit.filter(function(x){return x.status!=='Concluído'}).length)+metric('Spend sourcing','R$'+sum(state.src,'spend').toFixed(1)+'MM')+metric('Processos ahead',state.src.length)+metric('Gates pendentes',state.gates.filter(function(x){return x.negotiation_status==='Pendente'||x.strategy_status==='Pendente'}).length);({processos:processos,toolkit:toolkitPage,criticos:criticos,sourcing:sourcing,gates:gates})[state.tab]()}function metric(a,b){return '<article class="metric"><span>'+a+'</span><strong>'+b+'</strong></article>'}function sum(a,k){return a.reduce(function(s,x){return s+Number(x[k]||0)},0)}function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function processos(){document.getElementById('view').innerHTML='<div class="banner"><div><p class="eyebrow">Modelo operacional</p><h2>Do reativo ao planejado, com pipeline, gates e ciclo contratual integrados.</h2></div><button id="gateGo">Ver calendário de gates</button></div><div class="grid2">'+processBlocks.map(function(b){return '<article class="card"><h3>'+b[0]+'</h3>'+col('Processo esperado',b[1])+col('Gaps atuais',b[2],'warn')+col('To be proposto',b[3],'ok')+'</article>'}).join('')+'</div>';document.getElementById('gateGo').onclick=function(){state.tab='gates';render()}}function col(t,arr,c){return '<div class="col '+(c||'')+'"><strong>'+t+'</strong><ul>'+arr.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul></div>'}
function toolkitPage(){var html='<div class="legal"><strong>Minuta jurídica é elemento do processo.</strong><span>Começar na Etapa 01. Deixar para o final atrasa CLM e aumenta risco de fornecimento.</span></div><div class="banner light"><div><p class="eyebrow">Radar não exaustivo</p><h2>O checklist orienta o debate; itens podem sair quando não forem pertinentes.</h2></div><button id="down">Baixar checklist</button></div><div class="grid3">'+['Etapa 01','Etapa 02','Ativos'].map(function(g){return '<section class="tool"><h3>'+g+'</h3>'+toolkit.filter(function(x){return x[0]===g}).map(function(x){return '<div class="check"><div><strong>'+x[1]+'</strong><p class="muted">'+x[2]+'</p></div><span class="tag">'+x[3]+'</span></div>'}).join('')+'</section>'}).join('')+'</div><section><div class="section-head"><h2>Materiais de inspiração</h2>'+(state.admin?'<button id="addFile">Adicionar link</button>':'')+'</div><div class="grid3">'+state.files.map(function(f){return '<article class="file"><span class="tag">'+esc(f.file_type)+'</span><h3>'+esc(f.title)+'</h3><p class="muted">'+esc(f.description)+'</p>'+(f.file_url?'<a href="'+esc(f.file_url)+'" target="_blank">Abrir referência</a>':'')+'</article>'}).join('')+'</div></section>';document.getElementById('view').innerHTML=html;document.getElementById('down').onclick=downloadChecklist;var add=document.getElementById('addFile');if(add)add.onclick=addFile}
function downloadChecklist(){var csv='Etapa,Titulo,Obrigatorio,Descricao\n'+toolkit.map(function(x){return x.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"'}).join(',')}).join('\n');var a=document.createElement('a');a.href=window.URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='checklist-toolkit-servicos-corporativos.csv';a.click()}async function addFile(){var title=prompt('Nome do material');if(!title)return;var file_url=prompt('Link do arquivo')||'';await api('csc_inspiration_files',{method:'POST',body:{id:crypto.randomUUID(),title:title,description:'Material carregado pelo admin.',file_url:file_url,file_type:'Link'}});refresh()}
function criticos(){var open=state.crit.filter(function(x){return x.status!=='Concluído'});document.getElementById('view').innerHTML='<div class="section-head"><div><h2>Matriz criticidade x urgência</h2><p class="muted">Polaridade: quanto menos processos críticos abertos, melhor.</p></div>'+(state.admin?'<button id="addCrit">Novo crítico</button>':'')+'</div><div class="chart"><div class="matrix">'+open.map(function(x){return '<div class="dot '+(Number(x.criticality)+Number(x.urgency)>=8?'hot':'')+'" style="left:'+Number(x.criticality)*20+'%;bottom:'+Number(x.urgency)*20+'%"><span>'+esc(x.name)+'</span></div>'}).join('')+'</div></div>'+table(['Processo','Cluster','Spend','Gargalo executivo','C/U','Status','Ação'],state.crit.map(function(x){return [x.name,x.cluster,x.spend,x.executive_bottleneck,Number(x.criticality)+'/'+Number(x.urgency),x.status,state.admin&&x.status!=='Concluído'?'<button data-close="'+x.id+'">Concluir</button>':x.action_plan]}));var add=document.getElementById('addCrit');if(add)add.onclick=addCrit;Array.prototype.forEach.call(document.querySelectorAll('[data-close]'),function(b){b.onclick=function(){closeCrit(b.getAttribute('data-close'))}})}async function addCrit(){var name=prompt('Nome do processo crítico');if(!name)return;await api('csc_critical_processes',{method:'POST',body:{id:crypto.randomUUID(),name:name,cluster:'Facilities',month:'novo',category:'Categoria',spend:'R$0MM',criticality:3,urgency:3,status:'Aberto'}});refresh()}async function closeCrit(id){await api('csc_critical_processes?id=eq.'+id,{method:'PATCH',body:{status:'Concluído',updated_at:new Date().toISOString().slice(0,10)}});refresh()}
function sourcing(){var year=Number(document.getElementById('year')?document.getElementById('year').value:2026);var rows=state.src.filter(function(x){return Number(x.year)===year});var max=Math.max(1,Math.max.apply(null,rows.map(function(x){return Number(x.spend)})));document.getElementById('view').innerHTML='<div class="section-head"><div><h2>Pipeline '+year+'</h2><p class="muted">Esteira integrada de demandas por mês, pilar e spend.</p></div><div class="actions"><select id="year"><option '+(year===2026?'selected':'')+'>2026</option><option '+(year===2027?'selected':'')+'>2027</option></select>'+(state.admin?'<button id="addSource">Nova demanda</button>':'')+'</div></div><div class="chart"><div class="bars">'+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].map(function(m){var v=sum(rows.filter(function(x){return x.month===m}),'spend');return '<div class="bar" style="height:'+Math.max(2,v/max*240)+'px"><strong>'+(v?'R$'+v.toFixed(1)+'MM':'')+'</strong><span>'+m+'</span></div>'}).join('')+'</div></div>'+table(['Mês','Iniciativa','Categoria','Escopo','Pilar','Spend','Status'],rows.map(function(x){return [x.month,x.initiative,x.category,x.scope,x.pillar,'R$'+Number(x.spend).toFixed(1)+'MM',x.status]}));document.getElementById('year').onchange=sourcing;var add=document.getElementById('addSource');if(add)add.onclick=addSource}async function addSource(){var initiative=prompt('Nome da iniciativa');if(!initiative)return;await api('csc_sourcing_processes',{method:'POST',body:{id:crypto.randomUUID(),year:2026,month:'Jan',initiative:initiative,category:'Categoria',scope:'Escopo',pillar:'Facilities',spend:0,status:'Planejado'}});refresh()}
function gates(){document.getElementById('view').innerHTML='<div class="section-head"><div><h2>Agenda com GE</h2><p class="muted">R$5MM a R$15MM por e-mail; acima de R$15MM em gates.</p></div>'+(state.admin?'<button id="addGate">Novo gate</button>':'')+'</div>'+table(['Iniciativa','Categoria','Cliente','Owner','Valor global','Gate estratégia','Gate negociação','Status'],state.gates.map(function(x){return [x.initiative,x.category,x.client,x.owner,x.global_value?'R$'+Number(x.global_value).toFixed(1)+'MM':'N/A',x.strategy_gate||'N/A',x.negotiation_gate||'N/A',x.negotiation_status]}));var add=document.getElementById('addGate');if(add)add.onclick=addGate}async function addGate(){var initiative=prompt('Nome da iniciativa para gate');if(!initiative)return;await api('csc_gate_events',{method:'POST',body:{id:crypto.randomUUID(),initiative:initiative,category:'Categoria',pillar:'Facilities',client:'Cliente',owner:'',strategy_status:'Pendente',negotiation_status:'Pendente'}});refresh()}
function table(h,rows){return '<div class="table-wrap"><table><thead><tr>'+h.map(function(x){return '<th>'+x+'</th>'}).join('')+'</tr></thead><tbody>'+rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>'}
boot();
})();
</script>
</body>
</html>
