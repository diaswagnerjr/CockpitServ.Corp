name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Normalize date display
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = "function fmt(k,v){if(['spend_category','spend_involved','annual_spend','global_value','spend'].includes(k))return esc(money(v));if(['share_percent'].includes(k))return esc(pct(v));if(['strategy_status','negotiation_status'].includes(k))return gateStatusBadge(v);if(['status_summary','process_status','deadline_status'].includes(k))return statusBadge(v);return esc(v)}"
          new = "function dateBR(v){var s=String(v||'');var m=s.match(/^(\\d{4})-(\\d{2})-(\\d{2})/);return m?m[3]+'-'+m[2]+'-'+m[1]:s}function fmt(k,v){if(['spend_category','spend_involved','annual_spend','global_value','spend'].includes(k))return esc(money(v));if(['share_percent'].includes(k))return esc(pct(v));if(['expiration','strategy_gate','negotiation_gate','planned_capture_date','estimated_capture_date','updated_at','created_at'].includes(k))return esc(dateBR(v));if(['strategy_status','negotiation_status'].includes(k))return gateStatusBadge(v);if(['status_summary','process_status','deadline_status'].includes(k))return statusBadge(v);return esc(v)}"
          if 'function dateBR(v)' not in text and old in text:
              text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8', newline='')
          PY
      - name: Commit normalized source
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Formata datas no padrao brasileiro"
            git push
          fi
      - name: Prepare static site
        run: |
          mkdir -p site
          cp index.html site/index.html
          if [ -d assets ]; then cp -R assets site/assets; fi
          touch site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
