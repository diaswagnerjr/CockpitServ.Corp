name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch admin auth settings
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace("adminEmails=['wagnerdj@suzano.com.br'];", "adminEmails=['wagnerdj@suzano.com.br','bcarvalho.assigna@suzano.com.br'];")
          text = text.replace("redirect_to:location.origin+location.pathname", "redirect_to:'https://diaswagnerjr.github.io/CockpitServ.Corp/'")
          text = text.replace("Informe o e-mail admin liberado: wagnerdj@suzano.com.br", "Informe um e-mail admin liberado para este cockpit.")
          p.write_text(text, encoding='utf-8', newline='')
          PY
      - name: Commit patched source
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Ajusta reset de senha e admins"
            git push
          fi
      - name: Prepare static site
        run: |
          mkdir -p site
          cp index.html site/index.html
          if [ -d assets ]; then cp -R assets site/assets; fi
          touch site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
